<html lang="ar" dir="rtl">
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">

<body style="margin:0;background:linear-gradient(160deg,#f3f0ff,#e0f4ff)">
  <!-- شاشة انتظار بسيطة حتى يُحمَّل التطبيق (أول مرة تأخذ ثوانٍ) -->
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;color:#5f5c80">
    <img src="icons/Icon-192.png" width="96" height="96" alt="">
    <div style="font-size:20px;font-weight:700;color:#1e1b3a">حكيم | Hakeem</div>
    <div>جارٍ التحميل…</div>
  </div>
  <script>window.addEventListener('flutter-first-frame',function(){var l=document.getElementById('loading');if(l)l.remove();});</script>
