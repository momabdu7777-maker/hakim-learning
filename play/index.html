<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="description" content="حكيم | Hakeem — لعبة مغامرات لتعلّم الإنجليزية بالصوت والصورة واللعب">
<title>حكيم | Hakeem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. DESIGN TOKENS (per age group + light/dark)
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-ar:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-en:'Baloo 2','Cairo',system-ui,sans-serif;
  --emoji-font:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --good:#16a34a; --bad:#dc2626; --gold:#f5b301;
  --buddy-body:#8b5cf6; --buddy-dark:#5b21b6;
}
body{
  --primary:#7c5cff; --primary-2:#ff6fb5; --accent:#2ec4ff;
  --bg1:#f3f0ff; --bg2:#e0f4ff;
  --surface:rgba(255,255,255,.74); --surface-solid:#fff; --border:rgba(255,255,255,.85);
  --text:#1e1b3a; --muted:#5f5c80; --chip:rgba(124,92,255,.1); --line:rgba(30,27,58,.1);
  --good-bg:#dcfce7; --bad-bg:#fee2e2;
  --radius:20px; --scale:1; --shadow:0 10px 30px rgba(40,30,90,.12);
}
/* Little Explorers: bright, soft, huge */
body[data-age=kids]{--primary:#f0509a;--primary-2:#ff9f1c;--accent:#22a6e8;--bg1:#fff0f7;--bg2:#e6f7ff;--radius:28px;--scale:1.12;--chip:rgba(240,80,154,.12)}
/* Young Learners: playful but structured */
body[data-age=young]{--primary:#2f6fe4;--primary-2:#f97316;--accent:#10b981;--bg1:#eaf3ff;--bg2:#fff4e6;--radius:22px;--scale:1.04;--chip:rgba(47,111,228,.1)}
/* Teens: neon gradients */
body[data-age=teens]{--primary:#7c3aed;--primary-2:#db2777;--accent:#0891b2;--bg1:#f4f0ff;--bg2:#e6fbff;--radius:16px;--chip:rgba(124,58,237,.12)}
/* Adults: clean, elegant, minimal */
body[data-age=adults]{--primary:#0f766e;--primary-2:#1e40af;--accent:#a16207;--bg1:#f7f8fa;--bg2:#eef2f6;--radius:12px;--scale:.97;--chip:rgba(15,118,110,.08)}

html[data-theme=dark] body{
  --surface:rgba(32,32,62,.72); --surface-solid:#1d1d38; --border:rgba(255,255,255,.08);
  --text:#eef0ff; --muted:#a9acd0; --line:rgba(255,255,255,.1);
  --bg1:#12122a; --bg2:#1b1440; --shadow:0 10px 30px rgba(0,0,0,.4);
  --good-bg:rgba(22,163,74,.22); --bad-bg:rgba(220,38,38,.22);
}
html[data-theme=dark] body[data-age=kids]{--bg1:#1f1433;--bg2:#0f2440;--primary:#ff6fb0}
html[data-theme=dark] body[data-age=young]{--bg1:#0f1a33;--bg2:#24160c;--primary:#4f8bff}
html[data-theme=dark] body[data-age=teens]{--bg1:#090615;--bg2:#1a0b33;--primary:#9b6bff;--primary-2:#ff3d9a;--accent:#22d3ee}
html[data-theme=dark] body[data-age=adults]{--bg1:#0d1316;--bg2:#141c23;--primary:#14b8a6;--accent:#d4a72c}

/* =========================================================
   2. BASE
   ========================================================= */
html,body{min-height:100%}
body{
  font-family:var(--font-ar); color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed;
  min-height:100vh; min-height:100dvh; font-size:calc(16px * var(--scale)); line-height:1.6;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden; transition:background .4s;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}
.emoji{font-family:var(--emoji-font);line-height:1;font-style:normal}
.muted{color:var(--muted)} .small{font-size:.85em} .center{text-align:center}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* floating background blobs */
#bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-deco i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
#bg-deco i:nth-child(1){width:320px;height:320px;background:var(--primary);top:-80px;left:-90px}
#bg-deco i:nth-child(2){width:280px;height:280px;background:var(--accent);bottom:-60px;right:-80px;animation-delay:-6s}
#bg-deco i:nth-child(3){width:200px;height:200px;background:var(--primary-2);top:40%;left:55%;animation-delay:-11s;opacity:.22}
body[data-age=adults] #bg-deco i{opacity:.12}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}

#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 16px 120px;min-height:100vh;min-height:100dvh}
.screen{animation:screenIn .35s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* =========================================================
   3. COMPONENTS
   ========================================================= */
.glass{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:calc(var(--radius) * .75);font-weight:700;font-size:1rem;transition:transform .15s,box-shadow .2s,filter .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 40%,transparent)}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{background:var(--bad);color:#fff}
.btn-big{min-height:62px;font-size:1.2rem;padding:12px 34px}
.btn-wide{width:100%}
body[data-age=kids] .btn{min-height:62px;font-size:1.15rem}
body[data-age=teens] .btn-primary{box-shadow:0 0 22px color-mix(in srgb,var(--primary) 55%,transparent)}
body[data-age=adults] .btn-primary{background:var(--primary);box-shadow:none}

.icon-btn{width:48px;height:48px;min-width:48px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:1.25rem;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:40px;height:40px;min-width:40px;font-size:1rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--chip);font-weight:700;font-size:.92rem;white-space:nowrap}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:.8rem;font-weight:700}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar .title{flex:1;font-size:1.3rem;font-weight:800}
.topbar .chips{display:flex;gap:6px;flex-wrap:wrap}
.section-title{font-size:1.05rem;font-weight:800;margin:20px 4px 10px}

.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .5s ease}

/* toggle switch */
.switch{position:relative;width:58px;height:32px;border-radius:999px;background:var(--line);transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:right .2s}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]::after{right:30px}
.seg{display:inline-flex;background:var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;font-weight:700;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface-solid);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--primary)}

/* =========================================================
   4. SPLASH / PROFILES
   ========================================================= */
.splash{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.splash-buddy{width:min(220px,55vw);animation:floaty 3s ease-in-out infinite}
.logo{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;display:flex;gap:14px;align-items:baseline}
.logo .en{background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{font-style:normal;opacity:.35}
.tagline{font-size:1.1rem;color:var(--muted);max-width:420px}
@keyframes floaty{50%{transform:translateY(-10px)}}

.center-head{text-align:center;margin:10px 0 20px}
.center-head h1{font-size:1.5rem}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;text-align:center;transition:transform .2s}
.profile-card:hover{transform:translateY(-4px)}
.avatar{font-family:var(--emoji-font);font-size:3rem;line-height:1;width:76px;height:76px;display:grid;place-items:center;border-radius:50%;background:var(--chip)}
.avatar.sm{width:50px;height:50px;font-size:1.8rem}
.profile-card.add .avatar{border:2px dashed var(--muted);background:none;font-size:2rem}

.form-card{padding:20px;display:flex;flex-direction:column;gap:14px}
.form-card label{font-weight:800}
.text-input{width:100%;min-height:54px;padding:10px 16px;border-radius:calc(var(--radius) * .7);border:2px solid var(--line);background:var(--surface-solid);font-size:1.1rem}
.text-input:focus{border-color:var(--primary);outline:none}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.avatar-grid button{font-family:var(--emoji-font);font-size:2rem;height:60px;border-radius:16px;background:var(--surface-solid);border:2px solid transparent;transition:transform .15s}
.avatar-grid button[aria-pressed=true]{border-color:var(--primary);transform:scale(1.08);background:var(--chip)}
.age-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.age-card{padding:14px 10px;border-radius:var(--radius);background:var(--surface-solid);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.age-card .emoji{font-size:2.4rem}
.age-card b{font-size:1rem}
.age-card small{color:var(--muted)}
.age-card[aria-pressed=true]{border-color:var(--primary);background:var(--chip)}

/* =========================================================
   5. MAIN MENU
   ========================================================= */
.menu-head{padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.who{display:flex;gap:12px;align-items:center}
.who b{display:block;font-size:1.2rem}
.who small{color:var(--muted)}
.xpline{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.9rem}
.play-btn{width:100%;margin:18px 0;padding:22px;border-radius:calc(var(--radius) * 1.2);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:flex;align-items:center;gap:16px;box-shadow:0 14px 34px color-mix(in srgb,var(--primary) 40%,transparent);text-align:start;transition:transform .2s}
.play-btn:hover{transform:translateY(-3px)}
.play-btn .pi{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.8rem;flex-shrink:0;animation:pulse 2s infinite}
.play-btn b{display:block;font-size:1.6rem}
.play-btn small{opacity:.9}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini-card{padding:14px;display:flex;align-items:center;gap:12px;text-align:start}
.mini-card .emoji{font-size:2rem}
.mini-card b{display:block}
.mini-card small{color:var(--muted)}
.mini-card.done{opacity:.7}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:radial-gradient(closest-side,var(--surface-solid) 76%,transparent 78% 100%),conic-gradient(var(--primary) calc(var(--p) * 1%),var(--line) 0)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile-btn{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .2s;position:relative}
.tile-btn:hover{transform:translateY(-3px)}
.tile-btn .emoji{font-size:2.2rem}
.tile-btn b{font-size:1rem}
.tile-btn .count{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:12px;background:var(--bad);color:#fff;font-size:.75rem;display:grid;place-items:center;padding:0 6px;font-weight:800}
body[data-age=kids] .tile-btn .emoji{font-size:2.8rem}

/* =========================================================
   6. ADVENTURE MAP
   ========================================================= */
.world{margin-bottom:26px}
.world-head{padding:14px 16px;display:flex;align-items:center;gap:12px;border-inline-start:6px solid var(--w)}
.world-head .emoji{font-size:2.2rem}
.world-head b{display:block;font-size:1.15rem}
.world-head .en{color:var(--muted);font-size:.9rem}
.world-head .ws{margin-inline-start:auto}
.world.locked .world-head{filter:grayscale(.8);opacity:.7}
.path-wrap{position:relative;margin:6px auto 0;max-width:420px}
.path-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.path-wrap path{fill:none;stroke:color-mix(in srgb,var(--w) 45%,transparent);stroke-width:14;stroke-linecap:round;stroke-dasharray:2 22}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.node-btn{width:70px;height:70px;border-radius:50%;font-family:var(--font-en);font-weight:800;font-size:1.6rem;color:#fff;background:var(--w);box-shadow:0 6px 0 color-mix(in srgb,var(--w) 60%,#000),0 10px 20px rgba(0,0,0,.18);transition:transform .15s;display:grid;place-items:center}
.node-btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--w) 60%,#000)}
.node.boss .node-btn{width:86px;height:86px;font-size:2.2rem;background:linear-gradient(135deg,var(--w),#f5b301)}
.node.locked .node-btn{background:#b9b8c8;box-shadow:0 6px 0 #8f8ea3;font-size:1.3rem;cursor:not-allowed}
html[data-theme=dark] .node.locked .node-btn{background:#3a3a55;box-shadow:0 6px 0 #252540}
.node.current .node-btn{animation:nodePulse 1.6s infinite}
@keyframes nodePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.nstars{font-size:.95rem;letter-spacing:1px;color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.nstars .off{color:var(--line);text-shadow:none}
.node .me{position:absolute;top:-34px;font-family:var(--emoji-font);font-size:1.6rem;animation:floaty 1.6s infinite}
body[data-age=kids] .node-btn{width:80px;height:80px}

/* =========================================================
   7. GAMEPLAY
   ========================================================= */
.game-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.game-top .bar{height:16px}
.hearts{font-family:var(--emoji-font);font-size:1.1rem;white-space:nowrap;direction:ltr}
.hud-sub{display:flex;justify-content:space-between;align-items:center;min-height:28px;margin-bottom:6px;gap:8px}
.combo{font-weight:800;color:var(--primary-2);transition:transform .2s}
.combo.bump{animation:bump .4s}
.kind-tag{font-size:.85rem;color:var(--muted);font-weight:700}
.timer{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:10px}
.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px}
.prompt{font-size:1.2rem;font-weight:800;text-align:center}
body[data-age=kids] .prompt{font-size:1.4rem}
.speak-row{display:flex;gap:12px;justify-content:center;align-items:center}
.speak-btn{width:92px;height:92px;border-radius:50%;font-size:2.6rem;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--primary) 40%,transparent);display:grid;place-items:center;font-family:var(--emoji-font);transition:transform .15s}
.speak-btn:active{transform:scale(.92)}
.speak-btn.slow{width:62px;height:62px;font-size:1.7rem;background:var(--surface-solid);color:inherit;box-shadow:var(--shadow)}
.speak-btn.playing{animation:bump .5s infinite}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.options.list{grid-template-columns:1fr}
.opt{position:relative;min-height:120px;padding:14px 10px;border-radius:var(--radius);background:var(--surface);border:3px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s,border-color .2s,background .2s;backdrop-filter:blur(10px)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt .emoji{font-size:clamp(3rem,13vw,4.4rem)}
body[data-age=kids] .opt{min-height:150px}
body[data-age=kids] .opt .emoji{font-size:clamp(4rem,18vw,5.6rem)}
.opt .lbl{font-size:.95rem;font-weight:700;color:var(--muted)}
.opt.text{min-height:64px;font-size:1.15rem;font-weight:700}
.opt .kbd{position:absolute;top:6px;right:10px;font-size:.75rem;color:var(--muted);font-family:var(--font-en);opacity:.7}
.opt.correct{border-color:var(--good);background:var(--good-bg);animation:bounce .6s}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .45s}
.opt.dim{opacity:.45}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.96)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes bump{50%{transform:scale(1.15)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.big-emoji{font-size:clamp(5rem,26vw,8.5rem);filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));animation:pop .4s ease}
.hint-ar{font-size:1.1rem;color:var(--muted);font-weight:700}

/* spell + build tiles */
.slots,.build-line{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr;min-height:66px;padding:10px;width:100%;max-width:600px;border-radius:var(--radius)}
.build-line{background:var(--surface);border:2px dashed var(--line);align-items:center}
.build-line.empty::before{content:"اسحب الكلمات أو اضغط عليها هنا";direction:rtl;color:var(--muted);font-family:var(--font-ar);font-size:.95rem}
.slot{width:52px;height:60px;border-radius:14px;border:3px dashed var(--line);background:var(--surface)}
.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:ltr;min-height:66px;width:100%;max-width:600px}
.tile{min-width:52px;height:60px;padding:0 14px;border-radius:14px;background:var(--surface-solid);border:2px solid var(--line);border-bottom-width:5px;font-family:var(--font-en);font-weight:800;font-size:1.6rem;display:inline-grid;place-items:center;touch-action:none;user-select:none;transition:transform .12s}
.tile.word{font-size:1.2rem;height:52px}
.tile:active{transform:scale(.95)}
.tile.placeholder{visibility:hidden}
.tile.dragging{opacity:.3}
.slots .tile{border-color:var(--primary)}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;transform:scale(1.1) rotate(-3deg);box-shadow:0 12px 24px rgba(0,0,0,.25);opacity:.95}
.slots.ok .tile,.build-line.ok .tile{border-color:var(--good);background:var(--good-bg)}
.slots.no,.build-line.no{animation:shake .45s}
.slots.no .tile,.build-line.no .tile{border-color:var(--bad);background:var(--bad-bg)}

/* fill the gap */
.sentence{font-size:1.45rem;font-weight:700;text-align:center;line-height:2;padding:18px;max-width:600px;width:100%}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--primary);color:var(--primary);padding:0 8px}
.blank.ok{color:var(--good);border-color:var(--good)} .blank.no{color:var(--bad);border-color:var(--bad)}

/* memory match */

.mic.rec{animation:micPulse 1s infinite}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 28px rgba(239,68,68,0)}}
.heard{min-height:28px;font-weight:700;text-align:center}
.score-meter{width:min(320px,90%);display:flex;align-items:center;gap:10px;font-weight:800}

/* dialogue */
.dlg{width:100%;max-width:600px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.dlg-lines{width:100%;display:flex;flex-direction:column;gap:8px}
.bubble-line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.bubble-line .who-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--font-en);flex-shrink:0;font-size:.9rem}

.bubble-line small{display:block;color:var(--muted);font-size:.75rem}
.bubble-line.b{align-self:flex-end;flex-direction:row-reverse}

/* feedback panel */
.feedback{position:fixed;z-index:50;bottom:0;left:50%;width:min(780px,100%);transform:translate(-50%,110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);padding:16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;padding-left:86px;border-radius:26px 26px 0 0;background:var(--surface-solid);box-shadow:0 -10px 30px rgba(0,0,0,.18);border-top:6px solid var(--muted)}

<body data-age="young">
<div id="bg-deco" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="app"></main>
<div id="mascot" class="buddy-wrap off" role="button" tabindex="0" aria-label="حكيم — اضغط لنصيحة"></div>

<script>
'use strict';
/* =========================================================
   1. CONTENT DATA
   ---------------------------------------------------------
   Vocabulary is written compactly as "word|arabic|emoji|exampleSentence"
   and expanded at load time into structured objects:
   { word, arabic, emoji, exampleSentence, ageGroup, world, level }
   Levels (1–5) are assigned by position: earlier words = easier.
   ========================================================= */

/** Age-group rules: content, difficulty, lives, timers and tone. */
const AGE_GROUPS = {
  kids:   { id:'kids',   icon:'🧸', ar:'المستكشفون الصغار', en:'Little Explorers', range:'4–7 سنوات',
            hearts:Infinity, timer:0,  timerDefault:false, qCount:6,  pairs:3, speakPass:45, xp:10, coins:3,
            modes:['listen','truefalse','match','speak','pop'] },
  young:  { id:'young',  icon:'🎒', ar:'المتعلمون الصغار', en:'Young Learners', range:'8–12 سنة',
            hearts:3, timer:30, timerDefault:false, qCount:8,  pairs:4, speakPass:55, xp:10, coins:2, combo:true,
            modes:['listen','look','truefalse','spell','speak','match','pop','fill','build'] },
  teens:  { id:'teens',  icon:'🎧', ar:'المراهقون', en:'Teens', range:'13–17 سنة',
            hearts:3, timer:20, timerDefault:true,  qCount:10, pairs:4, speakPass:62, xp:10, coins:2, combo:true,
            modes:['listen','look','truefalse','spell','speak','match','pop','fill','build','dialogue'] },
  adults: { id:'adults', icon:'💼', ar:'البالغون', en:'Adults', range:'18+',
            hearts:5, timer:25, timerDefault:false, qCount:10, pairs:4, speakPass:68, xp:10, coins:2,
            modes:['listen','look','truefalse','spell','speak','match','fill','build','dialogue'] }
};

/** Level index (0-based) at which each game mode starts appearing:
    single words → phrases → full sentences → listening comprehension. */
const MODE_UNLOCK = { listen:0, look:0, truefalse:0, match:0, speak:1, spell:1, pop:1, fill:2, build:3, dialogue:3 };

/** Arabic instructions shown (and optionally spoken) for each mode. */
const MODE_PROMPTS = {
  listen:   { kids:'اسمع واختر الصورة 👂', def:'استمع واختر الإجابة الصحيحة' },
  look:     { def:'ما اسم هذه الصورة بالإنجليزية؟' },
  truefalse:{ kids:'هل الكلمة تطابق الصورة؟ 🤔', def:'هل الكلمة التي تسمعها تطابق الصورة؟' },
  pop:      { kids:'افقع البالون الصحيح! 🎈', def:'استمع وافقع البالون الصحيح قبل أن يطير! 🎈' },
  spell:    { def:'رتّب الحروف لتكتب الكلمة' },
  speak:    { kids:'قُل الكلمة بالإنجليزية 🎤', def:'انطق الكلمة بالإنجليزية' },
  match:    { kids:'اقلب البطاقات وطابق الكلمة مع الصورة 🃏', def:'طابق كل كلمة مع صورتها' },
  fill:     { def:'اختر الكلمة المناسبة لإكمال الجملة' },
  build:    { def:'رتّب الكلمات لتكوين جملة صحيحة' },
  dialogue: { def:'استمع إلى الحوار ثم أجب عن السؤال' }
};

const WORLDS = {};          // WORLDS[group] = [{id,name,ar,icon,color,words:[...],dialogues:[...]}]
const VOCAB = [];           // flat list of every word object
const VOCAB_BY_KEY = new Map();

/** Expand a group's compact world definitions into structured vocabulary. */
function defineWorlds(group, list) {
  WORLDS[group] = list.map((w, wi) => {
    const words = w.words.map((line, i, arr) => {
      const [word, arabic, emoji, exampleSentence] = line.split('|');
      const obj = {
        word, arabic, emoji, exampleSentence,
        ageGroup: group, world: w.id, worldIndex: wi,

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sum = a => a.reduce((s, x) => s + x, 0);
const pad2 = n => String(n).padStart(2, '0');
const todayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dayKeyOffset = off => todayKey(new Date(Date.now() + off * 864e5));
/** ISO week key, e.g. "2026-W44" — used for the weekly leaderboard. */
function weekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));

/* ---------- progression ---------- */
const LEVELS_PER_WORLD = 6; // 5 levels + 1 boss
const worldsOf = () => WORLDS[P().age];
const isDone = (w, l, gp = G()) => (gp.stars[w + '-' + l] || 0) > 0;
function isUnlocked(w, l, gp = G()) {
  if (w < gp.placement) return true;
  if (w === gp.placement && l === 0) return true;
  if (w === 0 && l === 0) return true;
  if (l > 0) return isDone(w, l - 1, gp);
  return isDone(w - 1, LEVELS_PER_WORLD - 1, gp);
}
/** First unlocked-but-unfinished node: where the player should go next. */
function currentNode() {
  const ws = worldsOf();
  for (let w = 0; w < ws.length; w++)
    for (let l = 0; l < LEVELS_PER_WORLD; l++)
      if (isUnlocked(w, l) && !isDone(w, l)) return [w, l];
  return [ws.length - 1, LEVELS_PER_WORLD - 1];
}
function totalStars(p) {
  return sum(Object.values(p.groups).map(g => sum(Object.values(g.stars))));
}
function levelInfo(xp) {
  let lvl = 1, need = 100, rest = xp;
  while (rest >= need) { rest -= need; lvl++; need = 100 + (lvl - 1) * 50; }
  return { lvl, cur: rest, need };
}
function addXP(x) {
  const p = P();
  const before = levelInfo(p.xp).lvl;
  p.xp += x;
  if (p.week.key !== weekKey()) p.week = { key: weekKey(), xp: 0 };
  p.week.xp += x;
  const after = levelInfo(p.xp).lvl;
  if (after > before) {
    setTimeout(() => { Sound.fanfare(); toast(`🎉 ترقية! وصلت إلى المستوى ${after}`); Confetti.burst(80); }, 400);
  }
}
const displayStreak = p => (p.lastDay === todayKey() || p.lastDay === dayKeyOffset(-1)) ? p.streak : 0;
function touchStreak() {
  const p = P(), t = todayKey();
  if (p.lastDay === t) return;
  p.streak = p.lastDay === dayKeyOffset(-1) ? p.streak + 1 : 1;
  p.bestStreak = Math.max(p.bestStreak, p.streak);
  p.lastDay = t;
  if (p.streak > 1) setTimeout(() => toast(`🔥 سلسلة ${p.streak} أيام متتالية!`), 600);
}

/* ---------- smart review (simple spaced repetition, Leitner boxes) ---------- */
const SRS_INTERVALS = [0, 5 * 60e3, 30 * 60e3, 6 * 3600e3, 24 * 3600e3, 3 * 24 * 3600e3, 7 * 24 * 3600e3];
function srsMark(word, ok) {
  const words = G().words;
  const r = words[word.key] || (words[word.key] = { c:0, w:0, box:0, due:0, seen:0 });
  r.seen = Date.now();
  if (ok) { r.c++; r.box = Math.min(SRS_INTERVALS.length - 1, r.box + 1); }
  else { r.w++; r.box = 0; }
  r.due = Date.now() + SRS_INTERVALS[r.box];
}
const isWeak = r => !!r && r.w > 0 && (r.box < 2 || r.w > r.c);
function learnedCount(p) {
  return sum(Object.values(p.groups).map(g => Object.values(g.words).filter(r => r.c > 0).length));
}
/** Words due for review, weakest first. */
function dueWords(limit = 12) {
  const gp = G(), now = Date.now();
  return Object.entries(gp.words)
    .filter(([, r]) => r.due <= now && (r.w > 0 || r.box < 3))
    .sort((a, b) => (isWeak(b[1]) - isWeak(a[1])) || (a[1].box - b[1].box))
    .map(([k]) => VOCAB_BY_KEY.get(k)).filter(Boolean).slice(0, limit);
}

/** Android app bridge (see MainActivity.java). Absent in a normal browser. */
const Native = window.HakeemNative || null;

const Speech = {
  supported: !!Native || 'speechSynthesis' in window,
  en: null, en2: null, ar: null,
  seq: 0, cbs: {},
  init() {
    if (Native) {
      // Android TextToSpeech: voices are chosen natively; we only record what exists
      this.en = 'native';
      this.en2 = Native.hasAltVoice() ? 'alt' : null;
      this.ar = Native.hasLang('ar') ? 'native-ar' : null;
      return;
    }
    if (!this.supported) return;
    const load = () => {
      const vs = speechSynthesis.getVoices();
      const enUS = vs.filter(v => /^en[-_]US/i.test(v.lang));
      const enAll = enUS.length ? enUS : vs.filter(v => /^en/i.test(v.lang));
      const prefer = [/Google US English/i, /Samantha/i, /Aria/i, /Jenny/i, /Zira/i, /Natural/i];
      this.en = prefer.map(r => enAll.find(v => r.test(v.name))).find(Boolean) || enAll[0] || null;
      const male = [/David/i, /Guy/i, /Alex/i, /Daniel/i, /Fred/i, /Male/i];
      this.en2 = male.map(r => enAll.find(v => r.test(v.name) && v !== this.en)).find(Boolean)
              || enAll.find(v => v !== this.en) || null;
      this.ar = vs.find(v => /^ar/i.test(v.lang)) || null;
    };
    load();
    speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', load) : (speechSynthesis.onvoiceschanged = load);
  },
  rate(slow) {
    if (slow || settings().speed === 'slow') return 0.6;
    return P() && P().age === 'kids' ? 0.85 : 0.95;
  },
  /** Speak text. opts: {slow, lang, alt (second voice), pitch, queue, onend} */
  say(text, opts = {}) {
    let done = false;
    const end = () => { if (!done) { done = true; opts.onend && opts.onend(); } };
    if (!this.supported || !text) { setTimeout(end, 400); return; }
    const rate = opts.rate || this.rate(opts.slow);
    if (Native) {
      const id = String(++this.seq);
      this.cbs[id] = end;
      try { Native.speak(text, opts.lang || 'en-US', rate, opts.pitch || 1, !!opts.alt, !!opts.queue, id); }
      catch (e) { delete this.cbs[id]; setTimeout(end, 300); return; }
      setTimeout(() => { delete this.cbs[id]; end(); }, 1500 + text.length * 140 / rate);
      return;
    }
    try {
      if (!opts.queue) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = opts.lang || 'en-US';
      const v = u.lang.startsWith('ar') ? this.ar : (opts.alt && this.en2) || this.en;
      if (v) u.voice = v;
      u.rate = rate;
      u.pitch = opts.pitch || 1;
      u.onend = end; u.onerror = end;
      speechSynthesis.speak(u);

      setTimeout(end, 1500 + text.length * 140 / u.rate);
    } catch (e) { setTimeout(end, 300); }
  },
  /** Arabic instruction (kids/young, if an Arabic voice exists), then the English audio. */
  hintThen(arText, thenFn) {
    const p = P();
    if (p && ['kids','young'].includes(p.age) && p.settings.arHints && this.ar && arText) {
      this.say(arText.replace(/[^؀-ۿ\s،؟]/g, ''), { lang:'ar-SA', rate:1, onend: () => setTimeout(thenFn, 150) });
    } else thenFn();
  },
  cancel() {
    try { Native ? Native.stop() : this.supported && speechSynthesis.cancel(); } catch (e) {}
  }
};

/** Speech recognition: browser Web Speech API, or Android's SpeechRecognizer via the bridge. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Recog = {
  h: null, cur: null,
  available() { try { return Native ? Native.srAvailable() : !!SR; } catch (e) { return false; } },
  /** handlers: { onresult(alternatives[]), onerror(code), onend() } */
  start(h) {
    this.stop();

const Sound = {
  ctx: null,
  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }

    return this.ctx;
  },
  /** One enveloped oscillator note. */
  tone(f, d, type = 'sine', vol = .15, delay = 0, slide = null) {
    if (!settings().sound) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(c.destination);

  },
  click()   { this.tone(620, .06, 'triangle', .08); },
  flip()    { this.tone(420, .08, 'triangle', .1, 0, 640); },
  correct(combo = 0) {

  },
  pop()     { this.tone(300, .08, 'sine', .18, 0, 900); this.tone(1200, .06, 'triangle', .06, .04); },
  chest()   { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .18, 'triangle', .12, i * .07)); },
  wrong()   { this.tone(220, .3, 'sawtooth', .07, 0, 110); this.tone(180, .3, 'square', .04, .05, 90); },
  coin()    { this.tone(988, .08, 'square', .05); this.tone(1319, .18, 'square', .05, .08); },
  star(i)   { this.tone(880 + i * 220, .2, 'triangle', .14); this.tone(1760 + i * 440, .15, 'sine', .05, .05); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'triangle', .14, i * .12));
    [523, 659, 784].forEach(f => this.tone(f * 2, .6, 'sine', .07, .5));

};

/** Soft generative background music (pentatonic over a I–vi–IV–V loop). */
const Music = {
  id: null, step: 0, out: null,
  chords: [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]],

    const rnd = seeded(+day.replace(/-/g, '') + p.age.length * 7);
    const pool = QUESTS.filter(q => q.id !== 'speak' || Recog.available());
    const chosen = pool.map(q => ({ q, r: rnd() })).sort((a, b) => a.r - b.r).slice(0, 3).map(x => x.q);
    p.quests = { day, bonus: false, list: chosen.map(q => ({ id: q.id, target: q.target[p.age] || q.target.def, n: 0, claimed: false })) };
  }
  return p.quests;
}
/** Record progress. mode 'max' keeps the best value (e.g. combo). */
function questEvent(id, n = 1, mode = 'add') {
  const p = P(); if (!p) return;
  questsToday().list.forEach(q => {
    if (q.id !== id || q.n >= q.target) return;
    q.n = Math.min(q.target, mode === 'max' ? Math.max(q.n, n) : q.n + n);
    if (q.n >= q.target) {
      const def = QUESTS.find(x => x.id === id);
      setTimeout(() => { toast(`🎯 مهمة مكتملة: ${def.icon} ${def.name} — استلم جائزتك من الرئيسية`); Sound.coin(); }, 700);
    }
  });
}

function toast(html, ms = 2800) {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = html;
  const wrap = $('#toast-wrap');
  // never stack more than 3: drop the oldest
  while (wrap.children.length >= 3) wrap.firstElementChild.remove();
  wrap.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms);
}

/** Promise-based modal. Resolves true (ok) / false (cancel). */
function modal({ title, text = '', html = '', ok = 'موافق', cancel = 'إلغاء', danger = false }) {
  return new Promise(res => {
    const root = $('#modal-root');
    state.modalPrevFocus = document.activeElement;
    root.innerHTML = `<div class="overlay"><div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h2 id="mt">${title}</h2>${text ? `<p>${text}</p>` : ''}${html}
      <div class="modal-btns"><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-m="1">${ok}</button>
      ${cancel ? `<button class="btn btn-ghost" data-m="0">${cancel}</button>` : ''}</div></div></div>`;
    state.modalResolve = res;
    $$('[data-m]', root).forEach(b => b.onclick = () => closeModal(b.dataset.m === '1'));
    $('.overlay', root).addEventListener('click', e => { if (e.target.classList.contains('overlay') && cancel) closeModal(false); });

}
function closeModal(v) {
  $('#modal-root').innerHTML = '';
  const r = state.modalResolve; state.modalResolve = null;
  if (state.modalPrevFocus && state.modalPrevFocus.focus) try { state.modalPrevFocus.focus(); } catch (e) {}
  r && r(v);
}

const Confetti = {
  parts: [], running: false, cv: null, cx: null,
  burst(n = 140) {
    if (reducedMotion()) n = Math.min(n, 25);
    const cv = this.cv || (this.cv = $('#confetti'));
    this.cx = this.cx || cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#f43f5e', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#facc15'];
    for (let i = 0; i < n; i++) this.parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .5, y: innerHeight * .35,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: pick(colors),
      r: Math.random() * 6, vr: (Math.random() - .5) * .3
    });
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); }
  },
  loop() {
    const { cx, cv } = this;
    cx.clearRect(0, 0, cv.width, cv.height);
    this.parts = this.parts.filter(p => p.y < cv.height + 30);
    for (const p of this.parts) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.loop());
    else { this.running = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }
};

    el.className = 'float-gain'; el.textContent = txt;

  return words[Math.floor(seeded(+todayKey().replace(/-/g, ''))() * words.length)];

      for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], ym = (a.y + b.y) / 2; d += ` C ${a.x} ${ym}, ${b.x} ${ym}, ${b.x} ${b.y}`; }
      const wStars = sum(pts.map((_, l) => gp.stars[wi + '-' + l] || 0));
      const locked = !isUnlocked(wi, 0);
      return `<section class="world ${locked ? 'locked' : ''}" style="--w:${w.color}" aria-label="${w.ar}">
        <div class="world-head glass"><span class="emoji">${w.icon}</span><div><b>${w.ar}</b><span class="en">${w.name}</span></div>
          <span class="chip ws">${locked ? '🔒 مقفل' : '⭐ ' + wStars + '/18'}</span></div>
        <div class="path-wrap" style="height:${H}px">
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>
          ${pts.map((pt, l) => {
            const un = isUnlocked(wi, l), st = gp.stars[wi + '-' + l] || 0, boss = l === 5;
            const cur = wi === cw && l === cl && un && !isDone(wi, l);
            const label = (boss ? 'مستوى الزعيم' : 'المستوى ' + (l + 1)) + ' — ' + w.ar + (un ? `، ${st} نجوم` : ' (مقفل)');
            return `<div class="node ${boss ? 'boss' : ''} ${un ? '' : 'locked'} ${cur ? 'current' : ''}" style="left:${pt.x}%;top:${pt.y}px">
              ${cur ? `<span class="me" aria-hidden="true">${p.avatar}</span>` : ''}
              <button class="node-btn" data-node="${wi}-${l}" ${un ? '' : 'disabled'} aria-label="${label}">${un ? (boss ? '👑' : l + 1) : '🔒'}</button>
              <div class="nstars" aria-hidden="true">${[0, 1, 2].map(i => `<span class="${i < st ? '' : 'off'}">★</span>`).join('')}</div></div>`;
          }).join('')}
        </div></section>`;
    }).join(''));
  $$('[data-node]').forEach(b => b.onclick = () => { const [w, l] = b.dataset.node.split('-').map(Number); Sound.click(); startRun('level', { w, l }); });
  const cur = $('.node.current');
  if (cur) setTimeout(() => cur.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' }), 250);
  Mascot.say(AG().id === 'adults' ? 'اختر المستوى التالي للمتابعة.' : 'اختر مستوى وابدأ المغامرة! 🗺️', 'happy', 2500);
};

/* =========================================================
   8. GAME ENGINE — building a run of questions
   ========================================================= */
const canSpell = w => /^[a-z]{3,10}$/i.test(w.word);
const sentTokens = s => s.split(/\s+/).map(t => t.replace(/^[^\w']+|[^\w']+$/g, '')).filter(Boolean);
const canBuild = (w, group) => { const n = sentTokens(w.exampleSentence).length; return n >= 3 && n <= (group === 'young' ? 8 : 11); };
const canFill = w => wordRegex(w.word).test(w.exampleSentence);
const FITS = { listen: () => true, look: () => true, truefalse: () => true, speak: () => true, spell: canSpell, fill: canFill, build: canBuild };

/** Words available for smart review: due first, then weak, then recently seen. */
function reviewPool() {
  const gp = G();
  const out = dueWords(10);
  const extra = Object.entries(gp.words)
    .filter(([k, r]) => r.c > 0 || r.w > 0)
    .sort((a, b) => (isWeak(b[1]) - isWeak(a[1])) || (a[1].box - b[1].box))
    .map(([k]) => VOCAB_BY_KEY.get(k)).filter(w => w && !out.includes(w));
  while (out.length < 6 && extra.length) out.push(extra.shift());
  return out;
}

function startRun(kind, opt = {}) {
  const p = P(), g = AGE_GROUPS[p.age];
  const practice = kind === 'placement' || kind === 'review';
  const run = {
    kind, group: p.age, w: opt.w || 0, l: opt.l || 0, idx: 0,
    correct: 0, wrong: 0, skipped: 0, mistakes: [], combo: 0, bestCombo: 0, xp: 0, coins: 0,
    ratios: [], start: Date.now(), hearts: practice ? Infinity : g.hearts, maxHearts: g.hearts,
    seenModes: {}, placeLog: [], retry: []
  };
  run.questions = buildQuestions(run);
  if (!run.questions.length) { toast('لا توجد أسئلة متاحة الآن'); return show('menu'); }
  state.run = run;
  // Introduce brand-new words before a regular level
  if (kind === 'level' && run.l < 5) {
    const fresh = WORLDS[run.group][run.w].words.filter(w => w.level === run.l + 1 && !(G().words[w.key] && G().words[w.key].c));
    if (fresh.length) return show('intro', fresh);
  }
  show('play');
}

function buildQuestions(run) {
  const g = AGE_GROUPS[run.group], ws = WORLDS[run.group];
  if (run.kind === 'level') {
    const w = ws[run.w], boss = run.l === 5;
    const pool = boss ? w.words.map(x => ({ x, wt: 1 }))
      : w.words.filter(x => x.level <= run.l + 1).map(x => ({ x, wt: x.level === run.l + 1 ? 3 : 1 }));
    const modes = g.modes.filter(m => MODE_UNLOCK[m] <= run.l);
    return composeRun(run, pool, modes, g.qCount + (boss ? 4 : 0), w.dialogues, boss ? 2 : 1);
  }
  if (run.kind === 'daily') {
    let words = ws.flatMap((w, wi) => w.words.filter(x => isUnlocked(wi, x.level - 1)));
    if (words.length < 6) words = ws[0].words.slice(0, 6);
    return composeRun(run, words.map(x => ({ x, wt: 1 })), g.modes.filter(m => m !== 'dialogue'), g.qCount);
  }
  if (run.kind === 'review') {
    const words = reviewPool();
    const modes = g.modes.filter(m => ['listen', 'look', 'truefalse', 'spell', 'fill', 'speak'].includes(m));
    return composeRun(run, words.map(x => ({ x, wt: 1 })), modes, Math.max(4, Math.min(10, words.length)));
  }
  // placement: 2 questions from each of the first five worlds, harder words
  const qs = [];
  for (let wi = 0; wi < Math.min(5, ws.length); wi++) {
    shuffle(ws[wi].words.filter(x => x.level >= 2)).slice(0, 2).forEach((w, k) => {
      const mode = run.group !== 'kids' && k === 1 && canFill(w) ? 'fill' : 'listen';
      const q = makeQ(mode, w, run); q.placeWorld = wi; qs.push(q);
    });
  }
  return qs;

/** Choose a varied sequence of modes, then pick words (weak & new words weighted up). */
function composeRun(run, pool, modes, n, dialogues = [], maxDlg = 1) {
  const g = AGE_GROUPS[run.group], gp = G();
  if (!pool.length) return [];
  pool.forEach(p => { if (isWeak(gp.words[p.x.key])) p.wt += 3; });
  const core = modes.filter(m => !['match', 'dialogue', 'pop'].includes(m));
  let bag = [];
  const nextMode = prev => {
    if (!bag.length) bag = shuffle(core);
    let m = bag.pop();
    if (m === prev && core.length > 1) { if (!bag.length) bag = shuffle(core); const alt = bag.pop(); bag.unshift(m); m = alt; }
    return m;
  };
  const seq = [];
  for (let i = 0; i < n; i++) seq.push(i === 0 && core.includes('listen') ? 'listen' : nextMode(seq[i - 1]));
  if (modes.includes('match') && pool.length >= 2) seq[Math.floor(n / 2)] = 'match';
  if (modes.includes('pop') && pool.length >= 3) seq[Math.floor(n * 0.75)] = 'pop';
  const dl = shuffle(dialogues);
  if (modes.includes('dialogue')) for (let k = 0; k < Math.min(maxDlg, dl.length); k++) seq[n - 2 - k * 3] = 'dialogue';

  const used = new Map(); let last = null, dIdx = 0;
  const takeWord = fit => {
    const cands = pool.filter(p => (p.x !== last || pool.length === 1) && fit(p.x, run.group));
    if (!cands.length) return null;
    const wts = cands.map(p => p.wt / (1 + 2 * (used.get(p.x) || 0)));
    let r = Math.random() * sum(wts);
    for (let i = 0; i < cands.length; i++) { r -= wts[i]; if (r <= 0) return cands[i].x; }
    return cands[cands.length - 1].x;
  };
  return seq.map(mode => {
    if (mode === 'dialogue') return { mode, dlg: dl[dIdx++], order: shuffle([0, 1, 2, 3]) };
    if (mode === 'match' || mode === 'pop') {
      const uniq = [];
      shuffle(pool.map(p => p.x)).forEach(x => { if (!uniq.some(u => u.emoji === x.emoji)) uniq.push(x); });
      return { mode, words: uniq.slice(0, mode === 'pop' ? 3 : g.pairs) };
    }
    let w = takeWord(FITS[mode]);
    if (!w) { mode = 'listen'; w = takeWord(FITS.listen) || pool[0].x; }
    used.set(w, (used.get(w) || 0) + 1); last = w;

}

function makeQ(mode, w, run) {
  const q = { mode, word: w };
  if (mode === 'listen' || mode === 'look') q.opts = shuffle([w, ...distractors(w, 3, run.group)]);
  if (mode === 'truefalse') { q.truth = Math.random() < .5; q.said = q.truth ? w : distractors(w, 1, run.group)[0]; }
  if (mode === 'fill') q.opts = shuffle([w, ...distractors(w, 3, run.group, true)]);
  if (mode === 'spell') {
    const letters = w.word.toLowerCase().split('');
    let s, tries = 0;
    do { s = shuffle(letters); } while (s.join('') === letters.join('') && tries++ < 10);
    q.letters = s.map((ch, i) => ({ id: i, ch }));
  }
  if (mode === 'build') {
    q.tokens = sentTokens(w.exampleSentence);
    let s, tries = 0;
    do { s = shuffle(q.tokens.map((t, i) => ({ id: i, t }))); } while (s.map(o => o.t).join(' ') === q.tokens.join(' ') && tries++ < 10);
    q.bank = s;
  }

}

/** Wrong options: same world first (different emoji), then the rest of the age group. */
function distractors(w, k, group, sameShape = false) {
  const multi = x => /\s/.test(x.word);
  const c = shuffle(WORLDS[group][w.worldIndex].words.filter(x => x !== w && x.emoji !== w.emoji && x.word.toLowerCase() !== w.word.toLowerCase()));
  if (sameShape) c.sort((a, b) => (multi(a) !== multi(w)) - (multi(b) !== multi(w)));
  const out = [];
  for (const x of c) { if (out.length >= k) break; if (!out.some(o => o.emoji === x.emoji)) out.push(x); }
  if (out.length < k) {
    const extra = shuffle(WORLDS[group].flatMap(x => x.words).filter(x => x !== w && x.emoji !== w.emoji && !out.some(o => o.emoji === x.emoji || o.word === x.word)));
    out.push(...extra.slice(0, k - out.length));
  }
  return out;
}

function answer(ok, extra = {}) {

  const secs = (Date.now() - run.qStart) / 1000;
  const retry = !!q.retry;   // correction-round questions don't affect stars or hearts

  else if (ok) {
    if (!retry) run.correct++;
    run.combo++;
    run.bestCombo = Math.max(run.bestCombo, run.combo);
    p.stats.bestCombo = Math.max(p.stats.bestCombo, run.combo);

    addXP(xp); run.xp += xp; p.coins += g.coins; run.coins += g.coins;
    if (q.mode === 'speak') { p.stats.speak++; questEvent('speak'); }
    if (SPEED_LIMIT[q.mode] && !retry) run.ratios.push(secs / (SPEED_LIMIT[q.mode] * (run.group === 'kids' ? 2 : 1)));

const MODES = {};
const optClasses = (btns, isRight, chosen) => btns.forEach((b, j) => {
  b.disabled = true;
  b.classList.add(isRight(j) ? 'correct' : j === chosen ? 'wrong' : 'dim');
});

MODES.listen = (q, st, run, prompt, first) => {

  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="speak-row"><button class="speak-btn" id="play" aria-label="استمع للكلمة">🔊</button><button class="speak-btn slow" id="slow" aria-label="استمع ببطء">🐢</button></div>

MODES.truefalse = (q, st, run, prompt, first) => {

  const yes = $('#tfYes'), no = $('#tfNo');

    yes.disabled = no.disabled = true;
    (q.truth ? yes : no).classList.add('correct');

  q.reveal = () => mark(null);

  setTimeout(() => Speech.hintThen(first ? prompt : null, () => { if (q.alive()) play(); }), 300);
};

/* 10) Word Balloons: hear a word, pop the matching balloon before it flies away */
MODES.pop = (q, st, run, prompt, first) => {
  const targets = q.words, dur = { kids: 9, young: 7.5 }[run.group] || 6.5;
  let t = 0, misses = 0, opts = [];
  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="speak-row"><button class="speak-btn slow" id="play" aria-label="استمع">🔊</button><span class="chip" id="popCount"></span></div>
    <div class="pop-field" id="field"></div>`;
  const field = $('#field');
  const say = () => { Speech.say(targets[t].word); pulse('#play'); };
  const spawn = () => {
    if (!q.alive()) return;
    const target = targets[t];
    opts = shuffle([target, ...distractors(target, run.group === 'kids' ? 2 : 3, run.group)]);
    $('#popCount').textContent = `🎈 ${t + 1} / ${targets.length}`;
    field.innerHTML = opts.map((o, i) => `<button class="balloon" style="left:${4 + i * (88 / opts.length) + rand(5)}%;animation-duration:${dur + rand(15) / 10}s;animation-delay:${(i * .3 + rand(4) / 10).toFixed(1)}s;--hue:${(i * 83 + rand(40)) % 360}" aria-label="بالون ${i + 1}">
      <span class="emoji">${o.emoji}</span></button>`).join('');
    const bs = $$('.balloon', field);
    bs.forEach((b, i) => b.onclick = () => {
      if (!q.alive() || b.classList.contains('popped')) return;
      if (opts[i] === target) {
        b.classList.add('popped'); bs.forEach(x => x.disabled = true);
        Sound.pop(); buzz(20); t++;
        if (t >= targets.length) setTimeout(() => answer(run.group === 'kids' || misses <= 2, { misses }), 450);
        else setTimeout(() => { spawn(); say(); }, 600);
      } else {
        misses++; Sound.wrong(); buzz([30, 40, 30]);
        b.classList.remove('wrongb'); void b.offsetWidth; b.classList.add('wrongb');
      }
    });
    const tb = bs[opts.indexOf(target)];
    tb.addEventListener('animationend', e => {
      if (e.target !== tb || e.animationName !== 'rise' || !q.alive() || tb.classList.contains('popped')) return;
      misses++;
      Mascot.say('طار البالون! استمع وحاول مرة أخرى 🎈', 'sad', 1800);
      spawn(); say();
    });
  };
  $('#play').onclick = say;
  q.hint = () => { const i = opts.indexOf(targets[t]); const b = $$('.balloon', field)[i]; if (!b) return false; b.classList.add('glow'); };
  state.key = e => {
    if (e.key === 'r' || e.key === 'R') say();
    else { const n = +e.key; const bs = $$('.balloon', field); if (n >= 1 && n <= bs.length) bs[n - 1].click(); }
  };
  spawn();
  setTimeout(() => Speech.hintThen(first ? prompt : null, () => { if (q.alive()) say(); }), 300);
};

/* 6) Fill the Gap */

  q.hint = fiftyFifty(q, btns, right);
  state.key = e => { const n = +e.key; if (n >= 1 && n <= 4) choose(n - 1); };
};

/** Pointer-based drag & drop that also works for touch; a plain tap/click calls tap(). */
function makeDraggable(el, { tap, drop }) {
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    let ghost = null, moved = false;
    const move = ev => {
      if (ev.pointerId !== pid) return;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        moved = true;
        const r = el.getBoundingClientRect();
        ghost = el.cloneNode(true); ghost.classList.add('drag-ghost');
        ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
        document.body.appendChild(ghost); el.classList.add('dragging');
      }
      if (moved) {
        ev.preventDefault();
        ghost.style.left = (ev.clientX - ghost.offsetWidth / 2) + 'px';
        ghost.style.top = (ev.clientY - ghost.offsetHeight / 2) + 'px';
      }
    };
    const up = ev => {
      if (ev.pointerId !== pid) return;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (!moved) return;
      ghost.remove(); el.classList.remove('dragging');
      el._dragged = true; setTimeout(() => { el._dragged = false; }, 60);
      if (ev.type === 'pointerup') drop(document.elementFromPoint(ev.clientX, ev.clientY), ev);
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  el.addEventListener('click', () => { if (!el._dragged) tap(); });
}

/* 2) See & Spell */
MODES.spell = (q, st, run, prompt) => {
  const target = q.word.word.toLowerCase(), slots = Array(target.length).fill(null);
  const chOf = id => q.letters[q.letters.findIndex(l => l.id === id)].ch;
  st.innerHTML = `<p class="prompt">${prompt}</p><span class="big-emoji emoji">${q.word.emoji}</span>
    <p class="hint-ar">${esc(q.word.arabic)} <button class="icon-btn sm" id="play" aria-label="استمع">🔊</button></p>
    <div class="slots" id="slots" aria-label="خانات الحروف"></div><div class="bank" id="bank" aria-label="الحروف"></div>
    <div class="row center"><button class="btn btn-ghost" id="clear">↺ مسح</button><button class="btn btn-primary" id="check" disabled>تحقّق ✓</button></div>`;
  const slotsEl = $('#slots'), bankEl = $('#bank'), checkBtn = $('#check');
  const place = (id, at) => { if (at == null) at = slots.indexOf(null); if (at >= 0) slots[at] = id; };
  const draw = () => {
    slotsEl.innerHTML = slots.map((id, i) => id == null ? `<div class="slot" data-slot="${i}"></div>`
      : `<button class="tile" data-slot="${i}" data-id="${id}" aria-label="${chOf(id)} — اضغط للإزالة">${chOf(id)}</button>`).join('');
    bankEl.innerHTML = q.letters.map(l => slots.includes(l.id) ? `<span class="tile placeholder" aria-hidden="true">${l.ch}</span>`
      : `<button class="tile" data-id="${l.id}">${l.ch}</button>`).join('');
    checkBtn.disabled = slots.includes(null);
    $$('button.tile', st).forEach(bind);
  };
  const bind = t => {
    const id = +t.dataset.id, from = t.dataset.slot != null ? +t.dataset.slot : null;
    makeDraggable(t, {
      tap() { if (run.answered) return; Sound.click(); if (from != null) slots[from] = null; else place(id); draw(); },
      drop(target) {
        if (run.answered) return;
        const s = target && target.closest('[data-slot]');
        if (s && slotsEl.contains(s)) {
          const to = +s.dataset.slot;
          if (from != null) [slots[to], slots[from]] = [slots[from], slots[to]]; else slots[to] = id;
        } else if (target && target.closest('#bank')) { if (from != null) slots[from] = null; }
        else if (target && target.closest('#slots') && from == null) place(id);
        Sound.click(); draw();
      }
    });
  };
  const check = () => {
    if (run.answered || slots.includes(null)) return;
    const ok = slots.map(chOf).join('') === target;
    slotsEl.classList.add(ok ? 'ok' : 'no');
    if (!ok) slotsEl.insertAdjacentHTML('afterend', `<p class="en" style="font-size:1.6rem;font-weight:800;color:var(--good)">${esc(target)}</p>`);
    $$('#bank button, #slots button, #clear, #check', st).forEach(b => b.disabled = true);
    answer(ok);
  };
  $('#play').onclick = () => Speech.say(q.word.word);
  $('#clear').onclick = () => { slots.fill(null); draw(); };
  checkBtn.onclick = check;
  q.reveal = () => {
    slotsEl.innerHTML = target.split('').map(c => `<span class="tile">${c}</span>`).join('');
    slotsEl.classList.add('ok'); bankEl.innerHTML = '';
  };
  q.hint = () => {
    const i = slots.findIndex((id, k) => id == null || chOf(id) !== target[k]);
    if (i < 0) return false;
    for (let k = i; k < slots.length; k++) if (slots[k] != null && chOf(slots[k]) !== target[k]) slots[k] = null;
    let l = q.letters.find(x => x.ch === target[i] && !slots.includes(x.id));
    if (!l) { const k = slots.findIndex((id, j) => j > i && id != null && chOf(id) === target[i]); l = q.letters.find(x => x.id === slots[k]); slots[k] = null; }
    slots[i] = l.id; draw();
    $$('#slots .tile')[i].classList.add('hinted');
  };
  state.key = e => {
    if (run.answered) return;
    if (e.key === 'Backspace') { for (let i = slots.length - 1; i >= 0; i--) if (slots[i] != null) { slots[i] = null; break; } draw(); }
    else if (e.key === 'Enter') check();
    else if (/^[a-z]$/i.test(e.key)) {
      const l = q.letters.find(x => x.ch === e.key.toLowerCase() && !slots.includes(x.id));
      if (l) { place(l.id); Sound.click(); draw(); }
    }
  };
  draw();
};

/* 5) Build the Sentence */
MODES.build = (q, st, run, prompt) => {
  const placed = [], tokOf = id => q.bank.find(b => b.id === id).t;
  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="speak-row"><span class="emoji" style="font-size:3.4rem">${q.word.emoji}</span>
      <button class="speak-btn slow" id="play" aria-label="استمع للجملة">🔊</button><button class="speak-btn slow" id="slow" aria-label="استمع ببطء">🐢</button></div>
    <div class="build-line" id="line" aria-label="الجملة"></div><div class="bank" id="bank" aria-label="الكلمات"></div>
    <div class="row center"><button class="btn btn-ghost" id="clear">↺ مسح</button><button class="btn btn-primary" id="check" disabled>تحقّق ✓</button></div>`;
  const line = $('#line'), bank = $('#bank'), checkBtn = $('#check');
  const insertIndex = (x, y) => {
    const tiles = $$('[data-pos]', line);
    for (const t of tiles) {
      const r = t.getBoundingClientRect();
      if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return +t.dataset.pos;
    }
    return tiles.length;
  };
  const draw = () => {
    line.innerHTML = placed.map((id, i) => `<button class="tile word" data-id="${id}" data-pos="${i}">${esc(tokOf(id))}</button>`).join('');
    line.classList.toggle('empty', !placed.length);
    bank.innerHTML = q.bank.map(b => placed.includes(b.id) ? `<span class="tile word placeholder" aria-hidden="true">${esc(b.t)}</span>`
      : `<button class="tile word" data-id="${b.id}">${esc(b.t)}</button>`).join('');
    checkBtn.disabled = placed.length !== q.bank.length;
    $$('button.tile', st).forEach(bind);
  };
  const bind = t => {
    const id = +t.dataset.id, inLine = t.dataset.pos != null;
    makeDraggable(t, {
      tap() { if (run.answered) return; Sound.click(); inLine ? placed.splice(placed.indexOf(id), 1) : placed.push(id); draw(); },
      drop(target, ev) {
        if (run.answered) return;
        if (target && target.closest('#line')) {
          let at = insertIndex(ev.clientX, ev.clientY);
          if (inLine) { const cur = placed.indexOf(id); placed.splice(cur, 1); if (at > cur) at--; }
          placed.splice(at, 0, id);
        } else if (target && target.closest('#bank') && inLine) placed.splice(placed.indexOf(id), 1);
        Sound.click(); draw();
      }
    });
  };
  const check = () => {
    if (run.answered || placed.length !== q.bank.length) return;
    const ok = placed.map(tokOf).join(' ').toLowerCase() === q.tokens.join(' ').toLowerCase();
    line.classList.add(ok ? 'ok' : 'no');
    if (!ok) line.insertAdjacentHTML('afterend', `<p class="en" style="font-size:1.2rem;font-weight:800;color:var(--good);text-align:center">${esc(q.word.exampleSentence)}</p>`);
    $$('#bank button, #line button, #clear, #check', st).forEach(b => b.disabled = true);
    answer(ok);
  };
  $('#play').onclick = () => { Speech.say(q.word.exampleSentence); pulse('#play'); };
  $('#slow').onclick = () => Speech.say(q.word.exampleSentence, { slow: true });
  $('#clear').onclick = () => { placed.length = 0; draw(); };
  checkBtn.onclick = check;
  q.reveal = () => { line.innerHTML = q.tokens.map(t => `<span class="tile word">${esc(t)}</span>`).join(''); line.classList.remove('empty'); line.classList.add('ok'); bank.innerHTML = ''; };
  q.hint = () => {
    let i = 0;
    while (i < placed.length && tokOf(placed[i]).toLowerCase() === q.tokens[i].toLowerCase()) i++;
    if (i >= q.tokens.length) return false;
    placed.length = i;
    const b = q.bank.find(x => !placed.includes(x.id) && x.t.toLowerCase() === q.tokens[i].toLowerCase());
    placed.push(b.id); draw();
  };
  state.key = e => {
    if (run.answered) return;
    if (e.key === 'Backspace') { placed.pop(); draw(); }
    else if (e.key === 'Enter') check();
    else if (e.key === 'r' || e.key === 'R') Speech.say(q.word.exampleSentence);
    else { const n = +e.key; const free = q.bank.filter(b => !placed.includes(b.id)); if (n >= 1 && n <= free.length) { placed.push(free[n - 1].id); Sound.click(); draw(); } }
  };
  draw();
};

/* 4) Match Pairs (memory cards) */
MODES.match = (q, st, run, prompt, first) => {
  const cards = shuffle([...q.words.map((w, i) => ({ w, i, img: true })), ...q.words.map((w, i) => ({ w, i, img: false }))]);
  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="memory ${cards.length > 6 ? 'c4' : ''}">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="بطاقة ${k + 1}">
      <span class="inner"><span class="face back" aria-hidden="true">💬</span><span class="face front ${c.img ? 'img' : ''}">${c.img ? c.w.emoji : esc(c.w.word)}</span></span></button>`).join('')}</div>`;
  const els = $$('.mcard', st);
  let open = [], lock = false, matched = 0, misses = 0;
  const flip = k => {
    const el = els[k], c = cards[k];
    if (lock || run.answered || el.classList.contains('flipped') || el.classList.contains('matched')) return;
    el.classList.add('flipped'); Sound.flip();
    el.setAttribute('aria-label', c.img ? `صورة: ${c.w.arabic}` : c.w.word);
    if (!c.img || run.group === 'kids') Speech.say(c.w.word);
    open.push(k);
    if (open.length < 2) return;
    lock = true;
    const [a, b] = open.map(i => cards[i]);
    if (a.i === b.i && a.img !== b.img) {
      setTimeout(() => {
        open.forEach(i => { els[i].classList.remove('flipped'); els[i].classList.add('matched'); els[i].disabled = true; });
        open = []; lock = false; matched++;
        Sound.tone(880, .12, 'sine', .12); Sound.tone(1175, .16, 'sine', .12, .08);
        if (matched === q.words.length) setTimeout(() => answer(run.group === 'kids' || misses <= q.words.length + 1, { misses }), 400);
      }, 350);
    } else {
      misses++;
      open.forEach(i => els[i].classList.add('miss'));
      setTimeout(() => { open.forEach(i => els[i].classList.remove('flipped', 'miss')); open = []; lock = false; }, 950);
    }
  };
  els.forEach((el, k) => el.onclick = () => flip(k));
  q.hint = () => {
    if (lock) return false;
    lock = true;
    els.forEach(e => { if (!e.classList.contains('matched')) e.classList.add('flipped'); });
    setTimeout(() => { els.forEach((e, k) => { if (!e.classList.contains('matched') && !open.includes(k)) e.classList.remove('flipped'); }); lock = false; }, 1400);
    q.hint = null;
  };
  state.key = e => { const n = +e.key; if (n >= 1 && n <= els.length) flip(n - 1); };
  if (first) setTimeout(() => Speech.hintThen(prompt, () => {}), 300);
};

/* 3) Speak It (SpeechRecognition with graceful fallback) */
const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const normSpeech = s => s.toLowerCase().replace(/\b(10|[0-9])\b/g, d => NUM_WORDS[+d]).replace(/'/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
/** Pronunciation score 0..1 from what the recognizer heard vs the target. */
function similarity(heard, target) {
  const a = normSpeech(heard), b = normSpeech(target);
  if (!a) return 0;
  if (a === b) return 1;
  if ((' ' + a + ' ').includes(' ' + b + ' ')) return 0.95;
  return Math.max(0, 1 - lev(a, b) / Math.max(a.length, b.length));
}

MODES.speak = (q, st, run, prompt, first) => {
  const w = q.word, pass = AGE_GROUPS[run.group].speakPass;
  let tries = 0;
  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="speak-card glass"><span class="big-emoji emoji">${w.emoji}</span><b class="en word">${esc(w.word)}</b><span class="muted">${esc(w.arabic)}</span>
      <div class="row center" style="margin-top:8px"><button class="btn btn-ghost" id="hear">🔊 استمع أولاً</button><button class="btn btn-ghost" id="hearSlow" aria-label="استمع ببطء">🐢</button></div></div>
    <div id="micArea" class="stack" style="align-items:center;width:100%"></div>
    <button class="btn btn-ghost" id="skipSpeak">تخطَّ ⏭️</button>`;
  $('#hear').onclick = () => Speech.say(w.word);
  $('#hearSlow').onclick = () => Speech.say(w.word, { slow: true });
  $('#skipSpeak').onclick = () => answer(false, { skip: true });
  const area = $('#micArea');
  const fallback = reason => {
    stopRecognition();
    area.innerHTML = `<p class="center muted">${reason}</p><p class="center"><b>استمع ثم كرّر الكلمة بصوت عالٍ 🗣️</b></p>
      <button class="btn btn-primary btn-big" id="saidIt">قلتها! ✅</button>`;
    $('#saidIt').onclick = () => answer(true, { skip: true, practice: true });
    state.key = e => { if (e.key === 'r' || e.key === 'R') Speech.say(w.word); };
  };
  if (!Recog.available()) fallback('ميزة التعرّف على الصوت غير متوفرة على هذا الجهاز أو المتصفح.');
  else {
    area.innerHTML = `<button class="mic" id="mic" aria-label="اضغط وتحدّث">🎤</button>
      <p class="heard" id="heard">اضغط على الميكروفون وقل الكلمة</p>
      <div class="score-meter hidden" id="meter"><div class="bar"><i id="scoreBar" style="width:0"></i></div><span class="en" id="scoreTxt">0%</span></div>`;
    const heard = $('#heard'), mic = $('#mic'), LISTEN = 'أنا أستمع... 👂';
    mic.onclick = () => {
      if (run.answered) return;
      if (Recog.active) { Recog.stop(); mic.classList.remove('rec'); heard.textContent = 'اضغط على الميكروفون وقل الكلمة'; return; }
      Speech.cancel();
      let got = false;
      mic.classList.add('rec'); heard.textContent = LISTEN;
      try {
        Recog.start({
          onresult: alts => {
            got = true; mic.classList.remove('rec');
            if (!alts.length || run.answered) return;
            const best = alts.map(t => ({ t, s: similarity(t, w.word) })).sort((a, b) => b.s - a.s)[0];
            const score = Math.round(best.s * 100);
            $('#meter').classList.remove('hidden');
            $('#scoreBar').style.width = score + '%'; $('#scoreTxt').textContent = score + '%';
            heard.innerHTML = `سمعتُ: <span class="en">"${esc(best.t)}"</span>`;
            if (score >= pass) answer(true, { score });
            else {
              tries++; Sound.wrong(); buzz([30, 40, 30]);
              heard.innerHTML += `<br><small>${score >= pass - 20 ? 'قريب جداً! 👌' : 'حاول مرة أخرى 💪'} — المحاولة ${tries}</small>`;
              Mascot.say(tries >= 2 ? 'استمع ببطء 🐢 ثم حاول، أو تخطَّ السؤال' : 'قريب! حاول مرة أخرى 💪', 'sad');
            }
          },
          onerror: err => {
            if (['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].includes(err))
              fallback(err === 'audio-capture' ? 'لم نجد ميكروفوناً متصلاً.' : err === 'network' ? 'التعرّف على الصوت يحتاج اتصالاً بالإنترنت.' : 'لم يُسمح باستخدام الميكروفون.');
            else if (err === 'no-speech') heard.textContent = 'لم أسمع شيئاً، حاول مرة أخرى 🎤';
            else if (err === 'busy') heard.textContent = 'الميكروفون مشغول، حاول بعد لحظة';
          },
          onend: () => {
            mic.classList.remove('rec');
            if (!got && heard.textContent === LISTEN) heard.textContent = 'لم أسمع شيئاً، حاول مرة أخرى 🎤';
          }
        });
      } catch (e) { fallback('تعذّر تشغيل الميكروفون.'); }
    };
    state.key = e => {
      if (e.key === 'm' || e.key === 'M' || e.key === ' ') { e.preventDefault(); mic.click(); }
      else if (e.key === 'r' || e.key === 'R') Speech.say(w.word);
    };
  }
  setTimeout(() => Speech.hintThen(first ? prompt : null, () => { if (q.alive()) Speech.say(w.word); }), 300);
};

/* 7) Dialogue Listening (teens / adults) */
function dlgLinesHTML(d) {
  const colors = ['var(--primary)', 'var(--primary-2)'];
  return d.lines.map(([who, txt], i) => `<div class="bubble-line ${i % 2 ? 'b' : ''}" data-line="${i}">
    <span class="who-av" style="background:${colors[i % 2]}" aria-hidden="true">${esc(who[0])}</span><p class="en"><small>${esc(who)}</small>${esc(txt)}</p></div>`).join('');
}
let dlgToken = 0;
function playDialogue(d, slow = false) {
  const tok = ++dlgToken, speakers = [...new Set(d.lines.map(l => l[0]))];
  const step = i => {
    if (tok !== dlgToken) return;
    $$('.bubble-line').forEach(b => b.classList.toggle('active', +b.dataset.line === i));
    if (i >= d.lines.length) return;
    const [who, txt] = d.lines[i], second = speakers.indexOf(who) === 1;
    Speech.say(txt, { slow, queue: i > 0, alt: second, pitch: second ? 0.85 : 1.1,
      onend: () => setTimeout(() => step(i + 1), 350) });
  };
  Speech.cancel(); step(0);
}
MODES.dialogue = (q, st, run, prompt, first) => {
  const d = q.dlg;
  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="dlg glass"><div class="row center">
      <button class="btn btn-primary" id="dplay">▶ استمع للحوار</button><button class="btn btn-ghost" id="dslow">🐢 ببطء</button>
      <button class="btn btn-ghost" id="dtext" aria-expanded="false">📝 النص</button></div>
      <div class="dlg-lines hidden" id="dlines">${dlgLinesHTML(d)}</div></div>
    <p class="question en">${esc(d.q)}</p><p class="hint-ar">${esc(d.qAr)}</p>
    <div class="options list">${q.order.map((oi, i) => `<button class="opt text en" data-i="${i}"><span class="kbd">${i + 1}</span>${esc(d.options[oi])}</button>`).join('')}</div>`;
  $('#dplay').onclick = () => playDialogue(d);
  $('#dslow').onclick = () => playDialogue(d, true);
  $('#dtext').onclick = e => { const hidden = $('#dlines').classList.toggle('hidden'); e.currentTarget.setAttribute('aria-expanded', String(!hidden)); };
  const btns = $$('.opt', st), right = j => q.order[j] === d.answer;
  const choose = i => { if (run.answered || btns[i].disabled) return; optClasses(btns, right, i); $('#dlines').classList.remove('hidden'); answer(right(i)); };
  q.hint = fiftyFifty(q, btns, right);
  btns.forEach((b, i) => b.onclick = () => choose(i));
  state.key = e => { const n = +e.key; if (n >= 1 && n <= 4) choose(n - 1); else if (e.key === 'r' || e.key === 'R') playDialogue(d); };
  setTimeout(() => Speech.hintThen(first ? prompt : null, () => { if (q.alive()) playDialogue(d); }), 400);
};

/* =========================================================
   10. GLOBAL EVENTS + INIT
   ========================================================= */
// 🔊 buttons and navigation anywhere in the app
document.addEventListener('click', e => {
  const t = e.target.closest('[data-say],[data-say-slow],[data-go]');
  if (!t || t.disabled) return;
  if (t.dataset.go) { Sound.click(); show(t.dataset.go); }
  else if (t.dataset.say != null) Speech.say(t.dataset.say);
  else Speech.say(t.dataset.saySlow, { slow: true });
});

// Keyboard support: each screen/mode installs state.key
document.addEventListener('keydown', e => {
  if ($('#modal-root').firstChild) { if (e.key === 'Escape') closeModal(false); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input,textarea,select')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('button,[role=button]')) return;
  if (e.key === 'Escape' && (state.screen === 'play' || state.screen === 'intro')) { quitRun(); return; }
  if (state.key) state.key(e);
});

// Time played (only while actively learning) + daily goal
let saveTick = 0;
setInterval(() => {
  const p = P();
  if (!p || document.hidden || !PLAY_SCREENS.includes(state.screen)) return;
  const k = todayKey(), before = p.daily[k] || 0, goal = p.settings.goal * 60;
  p.daily[k] = before + 5;
  if (before < goal && p.daily[k] >= goal) { toast('🎯 حققت هدفك اليومي! أحسنت'); Sound.fanfare(); }
  if (++saveTick % 6 === 0) save();
}, 5000);

document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { const c = $('#confetti'); if (Confetti.running) { c.width = innerWidth; c.height = innerHeight; } });

/** Android back button: true = handled inside the game, false = let the app exit. */
window.hakimBack = () => {
  if ($('#modal-root').firstChild) { closeModal(false); return true; }
  if (state.screen === 'play' || state.screen === 'intro') { quitRun(); return true; }
  const run = state.run;
  const parent = {
    map: 'menu', words: 'menu', achievements: 'menu', settings: 'menu', stats: 'menu', parent: 'menu',
    leaderboard: 'menu', shop: 'menu', fail: 'map',
    results: run && run.kind === 'level' ? 'map' : 'menu',
    create: Store.data.profiles.length ? 'profiles' : null,
    profiles: P() ? 'menu' : null
  }[state.screen];
  if (parent) { show(parent); return true; }
  return false;
};
window.hakimPause = () => { save(); Speech.cancel(); stopRecognition(); Music.stop(); };
window.hakimResume = () => { Music.sync(); };

function init() {
  Store.load();
  try { localStorage.setItem('hakeem.test', '1'); localStorage.removeItem('hakeem.test'); } catch (e) { Store.ok = false; }
  // prune play-time history older than ~90 days
  const cutoff = dayKeyOffset(-90);
  Store.data.profiles.forEach(p => Object.keys(p.daily || {}).forEach(k => { if (k < cutoff) delete p.daily[k]; }));
  Speech.init();
  Mascot.init();
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener ? mq.addEventListener('change', applyTheme) : mq.addListener && mq.addListener(applyTheme);
  }
  show('splash');
}
init();
</script>
