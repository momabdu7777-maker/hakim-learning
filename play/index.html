<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="description" content="حكيم | Hakeem — لعبة مغامرات لتعلّم الإنجليزية بالصوت والصورة واللعب">
<title>حكيم | Hakeem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. DESIGN TOKENS (per age group + light/dark)
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-ar:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-en:'Baloo 2','Cairo',system-ui,sans-serif;
  --emoji-font:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  --good:#16a34a; --bad:#dc2626; --gold:#f5b301;
  --buddy-body:#8b5cf6; --buddy-dark:#5b21b6;
}
body{
  --primary:#7c5cff; --primary-2:#ff6fb5; --accent:#2ec4ff;
  --bg1:#f3f0ff; --bg2:#e0f4ff;
  --surface:rgba(255,255,255,.74); --surface-solid:#fff; --border:rgba(255,255,255,.85);
  --text:#1e1b3a; --muted:#5f5c80; --chip:rgba(124,92,255,.1); --line:rgba(30,27,58,.1);
  --good-bg:#dcfce7; --bad-bg:#fee2e2;
  --radius:20px; --scale:1; --shadow:0 10px 30px rgba(40,30,90,.12);
}
/* Little Explorers: bright, soft, huge */
body[data-age=kids]{--primary:#f0509a;--primary-2:#ff9f1c;--accent:#22a6e8;--bg1:#fff0f7;--bg2:#e6f7ff;--radius:28px;--scale:1.12;--chip:rgba(240,80,154,.12)}
/* Young Learners: playful but structured */
body[data-age=young]{--primary:#2f6fe4;--primary-2:#f97316;--accent:#10b981;--bg1:#eaf3ff;--bg2:#fff4e6;--radius:22px;--scale:1.04;--chip:rgba(47,111,228,.1)}
/* Teens: neon gradients */
body[data-age=teens]{--primary:#7c3aed;--primary-2:#db2777;--accent:#0891b2;--bg1:#f4f0ff;--bg2:#e6fbff;--radius:16px;--chip:rgba(124,58,237,.12)}
/* Adults: clean, elegant, minimal */
body[data-age=adults]{--primary:#0f766e;--primary-2:#1e40af;--accent:#a16207;--bg1:#f7f8fa;--bg2:#eef2f6;--radius:12px;--scale:.97;--chip:rgba(15,118,110,.08)}

html[data-theme=dark] body{
  --surface:rgba(32,32,62,.72); --surface-solid:#1d1d38; --border:rgba(255,255,255,.08);
  --text:#eef0ff; --muted:#a9acd0; --line:rgba(255,255,255,.1);
  --bg1:#12122a; --bg2:#1b1440; --shadow:0 10px 30px rgba(0,0,0,.4);
  --good-bg:rgba(22,163,74,.22); --bad-bg:rgba(220,38,38,.22);
}
html[data-theme=dark] body[data-age=kids]{--bg1:#1f1433;--bg2:#0f2440;--primary:#ff6fb0}
html[data-theme=dark] body[data-age=young]{--bg1:#0f1a33;--bg2:#24160c;--primary:#4f8bff}
html[data-theme=dark] body[data-age=teens]{--bg1:#090615;--bg2:#1a0b33;--primary:#9b6bff;--primary-2:#ff3d9a;--accent:#22d3ee}
html[data-theme=dark] body[data-age=adults]{--bg1:#0d1316;--bg2:#141c23;--primary:#14b8a6;--accent:#d4a72c}

/* =========================================================
   2. BASE
   ========================================================= */
html,body{min-height:100%}
body{
  font-family:var(--font-ar); color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed;
  min-height:100vh; min-height:100dvh; font-size:calc(16px * var(--scale)); line-height:1.6;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden; transition:background .4s;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}
.emoji{font-family:var(--emoji-font);line-height:1;font-style:normal}
.muted{color:var(--muted)} .small{font-size:.85em} .center{text-align:center}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* floating background blobs */
#bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-deco i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
#bg-deco i:nth-child(1){width:320px;height:320px;background:var(--primary);top:-80px;left:-90px}
#bg-deco i:nth-child(2){width:280px;height:280px;background:var(--accent);bottom:-60px;right:-80px;animation-delay:-6s}
#bg-deco i:nth-child(3){width:200px;height:200px;background:var(--primary-2);top:40%;left:55%;animation-delay:-11s;opacity:.22}
body[data-age=adults] #bg-deco i{opacity:.12}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}

#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 16px 120px;min-height:100vh;min-height:100dvh}
.screen{animation:screenIn .35s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* =========================================================
   3. COMPONENTS
   ========================================================= */
.glass{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:calc(var(--radius) * .75);font-weight:700;font-size:1rem;transition:transform .15s,box-shadow .2s,filter .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 40%,transparent)}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{background:var(--bad);color:#fff}
.btn-big{min-height:62px;font-size:1.2rem;padding:12px 34px}
.btn-wide{width:100%}
body[data-age=kids] .btn{min-height:62px;font-size:1.15rem}
body[data-age=teens] .btn-primary{box-shadow:0 0 22px color-mix(in srgb,var(--primary) 55%,transparent)}
body[data-age=adults] .btn-primary{background:var(--primary);box-shadow:none}

.icon-btn{width:48px;height:48px;min-width:48px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:1.25rem;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:40px;height:40px;min-width:40px;font-size:1rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--chip);font-weight:700;font-size:.92rem;white-space:nowrap}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:.8rem;font-weight:700}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar .title{flex:1;font-size:1.3rem;font-weight:800}
.topbar .chips{display:flex;gap:6px;flex-wrap:wrap}
.section-title{font-size:1.05rem;font-weight:800;margin:20px 4px 10px}

.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .5s ease}

/* toggle switch */
.switch{position:relative;width:58px;height:32px;border-radius:999px;background:var(--line);transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:right .2s}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]::after{right:30px}
.seg{display:inline-flex;background:var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;font-weight:700;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface-solid);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--primary)}

/* =========================================================
   4. SPLASH / PROFILES
   ========================================================= */
.splash{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.splash-buddy{width:min(220px,55vw);animation:floaty 3s ease-in-out infinite}
.logo{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;display:flex;gap:14px;align-items:baseline}
.logo .en{background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{font-style:normal;opacity:.35}
.tagline{font-size:1.1rem;color:var(--muted);max-width:420px}
@keyframes floaty{50%{transform:translateY(-10px)}}

.center-head{text-align:center;margin:10px 0 20px}
.center-head h1{font-size:1.5rem}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;text-align:center;transition:transform .2s}
.profile-card:hover{transform:translateY(-4px)}
.avatar{font-family:var(--emoji-font);font-size:3rem;line-height:1;width:76px;height:76px;display:grid;place-items:center;border-radius:50%;background:var(--chip)}
.avatar.sm{width:50px;height:50px;font-size:1.8rem}
.profile-card.add .avatar{border:2px dashed var(--muted);background:none;font-size:2rem}

.form-card{padding:20px;display:flex;flex-direction:column;gap:14px}
.form-card label{font-weight:800}
.text-input{width:100%;min-height:54px;padding:10px 16px;border-radius:calc(var(--radius) * .7);border:2px solid var(--line);background:var(--surface-solid);font-size:1.1rem}
.text-input:focus{border-color:var(--primary);outline:none}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.avatar-grid button{font-family:var(--emoji-font);font-size:2rem;height:60px;border-radius:16px;background:var(--surface-solid);border:2px solid transparent;transition:transform .15s}
.avatar-grid button[aria-pressed=true]{border-color:var(--primary);transform:scale(1.08);background:var(--chip)}
.age-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.age-card{padding:14px 10px;border-radius:var(--radius);background:var(--surface-solid);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.age-card .emoji{font-size:2.4rem}
.age-card b{font-size:1rem}
.age-card small{color:var(--muted)}
.age-card[aria-pressed=true]{border-color:var(--primary);background:var(--chip)}

/* =========================================================
   5. MAIN MENU
   ========================================================= */
.menu-head{padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.who{display:flex;gap:12px;align-items:center}
.who b{display:block;font-size:1.2rem}
.who small{color:var(--muted)}
.xpline{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.9rem}
.play-btn{width:100%;margin:18px 0;padding:22px;border-radius:calc(var(--radius) * 1.2);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:flex;align-items:center;gap:16px;box-shadow:0 14px 34px color-mix(in srgb,var(--primary) 40%,transparent);text-align:start;transition:transform .2s}
.play-btn:hover{transform:translateY(-3px)}
.play-btn .pi{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.8rem;flex-shrink:0;animation:pulse 2s infinite}
.play-btn b{display:block;font-size:1.6rem}
.play-btn small{opacity:.9}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 16px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini-card{padding:14px;display:flex;align-items:center;gap:12px;text-align:start}
.mini-card .emoji{font-size:2rem}
.mini-card b{display:block}
.mini-card small{color:var(--muted)}
.mini-card.done{opacity:.7}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:radial-gradient(closest-side,var(--surface-solid) 76%,transparent 78% 100%),conic-gradient(var(--primary) calc(var(--p) * 1%),var(--line) 0)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile-btn{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .2s;position:relative}
.tile-btn:hover{transform:translateY(-3px)}
.tile-btn .emoji{font-size:2.2rem}
.tile-btn b{font-size:1rem}
.tile-btn .count{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:12px;background:var(--bad);color:#fff;font-size:.75rem;display:grid;place-items:center;padding:0 6px;font-weight:800}
body[data-age=kids] .tile-btn .emoji{font-size:2.8rem}

/* =========================================================
   6. ADVENTURE MAP
   ========================================================= */
.world{margin-bottom:26px}
.world-head{padding:14px 16px;display:flex;align-items:center;gap:12px;border-inline-start:6px solid var(--w)}
.world-head .emoji{font-size:2.2rem}
.world-head b{display:block;font-size:1.15rem}
.world-head .en{color:var(--muted);font-size:.9rem}
.world-head .ws{margin-inline-start:auto}
.world.locked .world-head{filter:grayscale(.8);opacity:.7}
.path-wrap{position:relative;margin:6px auto 0;max-width:420px}
.path-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.path-wrap path{fill:none;stroke:color-mix(in srgb,var(--w) 45%,transparent);stroke-width:14;stroke-linecap:round;stroke-dasharray:2 22}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.node-btn{width:70px;height:70px;border-radius:50%;font-family:var(--font-en);font-weight:800;font-size:1.6rem;color:#fff;background:var(--w);box-shadow:0 6px 0 color-mix(in srgb,var(--w) 60%,#000),0 10px 20px rgba(0,0,0,.18);transition:transform .15s;display:grid;place-items:center}
.node-btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--w) 60%,#000)}
.node.boss .node-btn{width:86px;height:86px;font-size:2.2rem;background:linear-gradient(135deg,var(--w),#f5b301)}
.node.locked .node-btn{background:#b9b8c8;box-shadow:0 6px 0 #8f8ea3;font-size:1.3rem;cursor:not-allowed}
html[data-theme=dark] .node.locked .node-btn{background:#3a3a55;box-shadow:0 6px 0 #252540}
.node.current .node-btn{animation:nodePulse 1.6s infinite}
@keyframes nodePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.nstars{font-size:.95rem;letter-spacing:1px;color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.nstars .off{color:var(--line);text-shadow:none}
.node .me{position:absolute;top:-34px;font-family:var(--emoji-font);font-size:1.6rem;animation:floaty 1.6s infinite}
body[data-age=kids] .node-btn{width:80px;height:80px}

/* =========================================================
   7. GAMEPLAY
   ========================================================= */
.game-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.game-top .bar{height:16px}
.hearts{font-family:var(--emoji-font);font-size:1.1rem;white-space:nowrap;direction:ltr}
.hud-sub{display:flex;justify-content:space-between;align-items:center;min-height:28px;margin-bottom:6px;gap:8px}
.combo{font-weight:800;color:var(--primary-2);transition:transform .2s}
.combo.bump{animation:bump .4s}
.kind-tag{font-size:.85rem;color:var(--muted);font-weight:700}
.timer{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:10px}
.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px}
.prompt{font-size:1.2rem;font-weight:800;text-align:center}
body[data-age=kids] .prompt{font-size:1.4rem}
.speak-row{display:flex;gap:12px;justify-content:center;align-items:center}
.speak-btn{width:92px;height:92px;border-radius:50%;font-size:2.6rem;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--primary) 40%,transparent);display:grid;place-items:center;font-family:var(--emoji-font);transition:transform .15s}
.speak-btn:active{transform:scale(.92)}
.speak-btn.slow{width:62px;height:62px;font-size:1.7rem;background:var(--surface-solid);color:inherit;box-shadow:var(--shadow)}
.speak-btn.playing{animation:bump .5s infinite}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.options.list{grid-template-columns:1fr}
.opt{position:relative;min-height:120px;padding:14px 10px;border-radius:var(--radius);background:var(--surface);border:3px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s,border-color .2s,background .2s;backdrop-filter:blur(10px)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt .emoji{font-size:clamp(3rem,13vw,4.4rem)}
body[data-age=kids] .opt{min-height:150px}
body[data-age=kids] .opt .emoji{font-size:clamp(4rem,18vw,5.6rem)}
.opt .lbl{font-size:.95rem;font-weight:700;color:var(--muted)}
.opt.text{min-height:64px;font-size:1.15rem;font-weight:700}
.opt .kbd{position:absolute;top:6px;right:10px;font-size:.75rem;color:var(--muted);font-family:var(--font-en);opacity:.7}
.opt.correct{border-color:var(--good);background:var(--good-bg);animation:bounce .6s}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .45s}
.opt.dim{opacity:.45}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.96)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes bump{50%{transform:scale(1.15)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.big-emoji{font-size:clamp(5rem,26vw,8.5rem);filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));animation:pop .4s ease}
.hint-ar{font-size:1.1rem;color:var(--muted);font-weight:700}

/* spell + build tiles */
.slots,.build-line{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr;min-height:66px;padding:10px;width:100%;max-width:600px;border-radius:var(--radius)}
.build-line{background:var(--surface);border:2px dashed var(--line);align-items:center}
.build-line.empty::before{content:"اسحب الكلمات أو اضغط عليها هنا";direction:rtl;color:var(--muted);font-family:var(--font-ar);font-size:.95rem}
.slot{width:52px;height:60px;border-radius:14px;border:3px dashed var(--line);background:var(--surface)}
.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:ltr;min-height:66px;width:100%;max-width:600px}
.tile{min-width:52px;height:60px;padding:0 14px;border-radius:14px;background:var(--surface-solid);border:2px solid var(--line);border-bottom-width:5px;font-family:var(--font-en);font-weight:800;font-size:1.6rem;display:inline-grid;place-items:center;touch-action:none;user-select:none;transition:transform .12s}
.tile.word{font-size:1.2rem;height:52px}
.tile:active{transform:scale(.95)}
.tile.placeholder{visibility:hidden}
.tile.dragging{opacity:.3}
.slots .tile{border-color:var(--primary)}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;transform:scale(1.1) rotate(-3deg);box-shadow:0 12px 24px rgba(0,0,0,.25);opacity:.95}
.slots.ok .tile,.build-line.ok .tile{border-color:var(--good);background:var(--good-bg)}
.slots.no,.build-line.no{animation:shake .45s}
.slots.no .tile,.build-line.no .tile{border-color:var(--bad);background:var(--bad-bg)}

/* fill the gap */
.sentence{font-size:1.45rem;font-weight:700;text-align:center;line-height:2;padding:18px;max-width:600px;width:100%}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--primary);color:var(--primary);padding:0 8px}
.blank.ok{color:var(--good);border-color:var(--good)} .blank.no{color:var(--bad);border-color:var(--bad)}

/* memory match */
.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px;perspective:900px}
.memory.c4{grid-template-columns:repeat(4,1fr)}
.mcard{aspect-ratio:3/4;position:relative}
.mcard .inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.flipped .inner,.mcard.matched .inner{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:calc(var(--radius) * .7);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center}
.mcard .back{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:2rem;font-family:var(--emoji-font);box-shadow:var(--shadow)}
.mcard .front{background:var(--surface-solid);transform:rotateY(180deg);border:3px solid var(--line);font-family:var(--font-en);font-weight:800;font-size:clamp(.9rem,3.6vw,1.2rem);word-break:break-word}
.mcard .front.img{font-family:var(--emoji-font);font-size:clamp(2rem,10vw,3rem)}
.mcard.matched .front{border-color:var(--good);background:var(--good-bg)}
.mcard.matched{animation:bounce .6s}
.mcard.miss .front{border-color:var(--bad)}

/* speak it */
.speak-card{padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:min(340px,100%)}
.speak-card .word{font-size:2rem;font-weight:800}
.mic{width:104px;height:104px;border-radius:50%;font-size:3rem;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;box-shadow:0 10px 26px rgba(239,68,68,.35);display:grid;place-items:center;font-family:var(--emoji-font)}
.mic.rec{animation:micPulse 1s infinite}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 28px rgba(239,68,68,0)}}
.heard{min-height:28px;font-weight:700;text-align:center}
.score-meter{width:min(320px,90%);display:flex;align-items:center;gap:10px;font-weight:800}
.score-meter .bar>i{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)}

/* dialogue */
.dlg{width:100%;max-width:600px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.dlg-lines{width:100%;display:flex;flex-direction:column;gap:8px}
.bubble-line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.bubble-line .who-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--font-en);flex-shrink:0;font-size:.9rem}
.bubble-line p{background:var(--surface-solid);padding:8px 14px;border-radius:16px;border:1px solid var(--line);font-size:1.05rem}
.bubble-line small{display:block;color:var(--muted);font-size:.75rem}
.bubble-line.b{align-self:flex-end;flex-direction:row-reverse}
.bubble-line.active p{border-color:var(--primary);box-shadow:0 0 0 3px var(--chip)}
.question{font-size:1.2rem;font-weight:800;text-align:center}

/* feedback panel */
.feedback{position:fixed;z-index:50;bottom:0;left:50%;width:min(780px,100%);transform:translate(-50%,110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);padding:16px 16px calc(16px + env(safe-area-inset-bottom)) 16px;padding-left:86px;border-radius:26px 26px 0 0;background:var(--surface-solid);box-shadow:0 -10px 30px rgba(0,0,0,.18);border-top:6px solid var(--muted)}
.feedback{visibility:hidden}
.feedback.show{transform:translate(-50%,0);visibility:visible}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)} .feedback.skip{border-color:var(--accent)}
.fb-title{font-size:1.25rem;font-weight:800;margin-bottom:8px}
.feedback.ok .fb-title{color:var(--good)} .feedback.no .fb-title{color:var(--bad)}
.fb-tip{color:var(--muted);font-weight:700;margin:-4px 0 8px;font-size:.95rem}
.fb-word{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fb-word .emoji{font-size:2.6rem}
.fb-word b{display:block;font-size:1.4rem}
.fb-word div{flex:1}
.fb-sent{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-weight:600}
.fb-sent span{flex:1}

/* intro (learn) cards */
.learn-card{padding:26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:100%;max-width:440px;margin:10px auto;animation:pop .4s}
.learn-card .big-emoji{font-size:clamp(5rem,28vw,8rem)}
.learn-card .word{font-size:2.2rem;font-weight:800}
.learn-card .ar{font-size:1.3rem;font-weight:700;color:var(--muted)}
.example{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;margin-top:8px}

/* =========================================================
   8. RESULTS / LISTS / STATS
   ========================================================= */
.results{padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.results h1{font-size:1.6rem}
.big-stars{display:flex;gap:10px;justify-content:center;font-size:3.6rem;direction:ltr}
.big-stars span{color:var(--line);transform:scale(.4);opacity:.4;transition:all .4s cubic-bezier(.2,.9,.3,1.5)}
.big-stars span.on{color:var(--gold);transform:scale(1);opacity:1;text-shadow:0 4px 14px rgba(245,179,1,.5)}
.big-stars span:nth-child(2){transform-origin:center bottom;margin-top:-14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.stat{padding:12px;border-radius:calc(var(--radius) * .7);background:var(--chip);text-align:center}
.stat b{display:block;font-size:1.4rem;font-family:var(--font-en)}
.stat small{color:var(--muted);font-weight:700}
.word-list{display:flex;flex-direction:column;gap:8px;width:100%}
.word-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:calc(var(--radius) * .7);background:var(--surface);border:1px solid var(--border);text-align:start}
.word-row .emoji{font-size:2rem;width:44px;text-align:center}
.word-row .wtxt{flex:1;min-width:0}
.word-row b{display:block;font-size:1.1rem}
.word-row small{color:var(--muted)}
.word-row .weak{background:var(--bad-bg);color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;min-height:42px}
.tabs button[aria-selected=true]{background:var(--primary);color:#fff;border-color:transparent}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach{padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.ach .emoji{font-size:2.6rem}
.ach small{color:var(--muted);font-size:.8rem}
.ach.locked{filter:grayscale(1);opacity:.5}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px 4px 0;direction:ltr}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--primary),var(--primary-2));min-height:3px}
.chart small{font-size:.72rem;color:var(--muted);font-family:var(--font-ar)}
.panel{padding:16px;margin-bottom:14px}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px}
.lb-row.me{background:var(--chip);outline:2px solid var(--primary)}
.lb-row .rank{width:32px;font-family:var(--font-en);font-weight:800;font-size:1.2rem;text-align:center}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-row b{display:block}
.set-row small{color:var(--muted)}

/* =========================================================
   9. MASCOT, TOASTS, MODAL, CONFETTI
   ========================================================= */
#mascot{position:fixed;left:10px;bottom:12px;width:74px;height:82px;z-index:60;cursor:pointer;animation:floaty 3.2s ease-in-out infinite;transition:width .3s,height .3s}
#mascot.off{display:none}
body[data-screen=play] #mascot{width:64px;height:70px}
.buddy{width:100%;height:100%;overflow:visible;display:block}
.buddy .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.buddy .pupils{transition:transform .3s}
.buddy .cheeks{transition:opacity .3s}
.buddy .wing{transform-box:fill-box}
.buddy .wing-l{transform-origin:right top} .buddy .wing-r{transform-origin:left top}
.buddy-wrap.happy .buddy,.buddy-wrap.celebrate .buddy{animation:hop .5s ease 2}
.buddy-wrap.happy .cheeks,.buddy-wrap.celebrate .cheeks{opacity:.8}
.buddy-wrap.celebrate .wing-l{animation:flapL .2s ease-in-out 8 alternate}
.buddy-wrap.celebrate .wing-r{animation:flapR .2s ease-in-out 8 alternate}
.buddy-wrap.think .pupils{transform:translate(3px,-4px)}
.buddy-wrap.think .buddy{transform:rotate(-6deg);transition:transform .3s}
.buddy-wrap.sad .pupils{transform:translateY(4px)}
.buddy-wrap.sad .buddy{transform:rotate(5deg);transition:transform .3s}
.buddy .mouth{transform-box:fill-box;transform-origin:center;transition:transform .3s}
.buddy-wrap.sad .mouth{transform:scaleY(-1) translateY(-3px)}
.buddy-wrap.happy .mouth,.buddy-wrap.celebrate .mouth{transform:scale(1.25)}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes flapL{to{transform:rotate(-35deg)}}
@keyframes flapR{to{transform:rotate(35deg)}}
.mascot-bubble{position:absolute;bottom:88%;left:44px;width:max-content;max-width:min(260px,70vw);background:var(--surface-solid);color:var(--text);padding:10px 14px;border-radius:18px 18px 18px 4px;box-shadow:var(--shadow);border:2px solid var(--primary);font-weight:700;font-size:.95rem;line-height:1.5;opacity:0;transform:translateY(8px) scale(.9);transform-origin:left bottom;transition:all .25s;pointer-events:none}
.mascot-bubble.show{opacity:1;transform:none}

#toast-wrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{padding:12px 16px;border-radius:16px;background:var(--surface-solid);box-shadow:var(--shadow);border-inline-start:5px solid var(--primary);font-weight:700;animation:toastIn .35s ease both}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

.overlay{position:fixed;inset:0;z-index:250;background:rgba(10,8,30,.5);display:grid;place-items:center;padding:16px;animation:screenIn .2s}
.modal{width:min(420px,100%);padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--surface-solid);max-height:92vh;overflow:auto}
.modal h2{font-size:1.3rem}
.modal-btns{display:flex;gap:10px;flex-wrap:wrap}
.modal-btns .btn{flex:1}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:280}

/* =========================================================
   10. ENGAGEMENT: hints, balloons, true/false, quests, shop, chest
   ========================================================= */
.stage.q-in{animation:qIn .35s ease both}
@keyframes qIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.hint-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;min-height:38px;border-radius:999px;background:linear-gradient(135deg,#fde68a,#f59e0b);color:#3b2a00;font-weight:800;font-family:var(--emoji-font),var(--font-ar);box-shadow:0 3px 10px rgba(245,158,11,.35)}
.hint-btn small{font-family:var(--font-ar);font-size:.75rem}
.hint-btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.tile.hinted{animation:bounce .6s;border-color:#f59e0b!important}
.float-gain{position:fixed;z-index:120;pointer-events:none;font-weight:800;font-family:var(--font-en);font-size:1.25rem;color:var(--good);text-shadow:0 2px 0 #fff,0 0 12px rgba(255,255,255,.8);animation:floatUp 1.1s ease-out both}
html[data-theme=dark] .float-gain{text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-60px) scale(1)}}

.tf-word{font-size:1.8rem}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:460px}
.tf{min-height:96px;border-radius:var(--radius);font-size:1.3rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px solid transparent;transition:transform .15s}
.tf .emoji{font-size:2.2rem}
.tf.yes{background:var(--good-bg);color:var(--good)} .tf.no{background:var(--bad-bg);color:var(--bad)}
.tf:active{transform:scale(.95)}
.tf.correct{border-color:var(--good);animation:bounce .6s} .tf.wrong{border-color:var(--bad);animation:shake .45s}
.tf:disabled{cursor:default}

.pop-field{position:relative;width:100%;max-width:560px;height:min(400px,52vh);border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,rgba(125,211,252,.35),rgba(255,255,255,.15));border:1px solid var(--border)}
html[data-theme=dark] .pop-field{background:linear-gradient(180deg,rgba(30,58,138,.45),rgba(15,23,42,.2))}
.balloon{position:absolute;bottom:-110px;width:clamp(68px,20vw,90px);height:clamp(80px,24vw,104px);border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),transparent 28%),hsl(var(--hue) 85% 62%);
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.08),0 8px 16px rgba(0,0,0,.15);display:grid;place-items:center;
  animation:rise linear forwards;touch-action:manipulation}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:rgba(0,0,0,.25)}
.balloon .emoji{font-size:clamp(2rem,9vw,2.6rem);animation:sway 2.2s ease-in-out infinite alternate}
.balloon.popped{animation-play-state:paused}
.balloon.popped .emoji{animation:none}
.balloon.popped{background:none;box-shadow:none}
.balloon.popped::after{display:none}
.balloon.popped .emoji{animation:popb .4s ease forwards}
.balloon.wrongb .emoji{animation:shake .4s}
.balloon.glow{box-shadow:0 0 0 5px #fde047,0 0 26px 8px rgba(253,224,71,.8)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-1 * min(400px,52vh) - 240px))}}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes popb{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(0);opacity:0}}

.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:flex;align-items:center;gap:10px}
.quest .emoji{font-size:1.6rem;width:36px;text-align:center}
.quest .qtxt{flex:1;min-width:0}
.quest .qtxt b{font-size:.95rem}
.quest .bar{height:9px}
.quest small{color:var(--muted);font-size:.8rem}
.quest.claimed{opacity:.55}
.quest .claim{min-height:40px;padding:6px 14px;font-size:.9rem;animation:bump 1.2s infinite}
.wod{margin-bottom:12px}
.wod .wod-txt{flex:1}
.wod b{font-size:1.4rem;display:block}

.shop-preview{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:6px}
.shop-preview .buddy-wrap{width:110px;height:122px;flex-shrink:0}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.shop-item{padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px solid transparent}
.shop-item .sw{height:48px;display:grid;place-items:center}
.shop-item .sw .emoji{font-size:2.2rem}
.shop-item .sw i{display:block;width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.shop-item b{font-size:.85rem}
.shop-item small{color:var(--muted);font-weight:700;font-size:.78rem}
.shop-item.equipped{border-color:var(--primary);background:var(--chip)}

.chest{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 26px;border-radius:var(--radius);background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;font-weight:800;animation:chestWiggle 1.4s ease-in-out infinite;box-shadow:0 8px 22px rgba(245,158,11,.35)}
.chest .emoji{font-size:3.2rem}
.chest b{font-size:1.6rem}
.chest.open{animation:pop .45s ease}
@keyframes chestWiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg) scale(1.05)}80%{transform:rotate(8deg) scale(1.05)}90%{transform:rotate(-4deg)}}

/* =========================================================
   11. HAKEEM REELS
   ========================================================= */
body[data-screen=reels] #app{padding-bottom:0}
body[data-screen=reels] .topbar{margin-bottom:6px}
body[data-screen=reels] .topbar .title{font-size:1.1rem;white-space:nowrap}
.reels{height:calc(100vh - 86px);height:calc(100dvh - 86px);overflow-y:auto;scroll-snap-type:y mandatory;margin:0 -16px;padding:0 16px;overscroll-behavior:contain;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{min-height:calc(100vh - 86px);min-height:calc(100dvh - 86px);scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:6px 0 18px}
.reel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.reel-head b{font-family:var(--font-en);font-size:1.3rem;direction:ltr}
.reel-head .reel-n{margin-inline-start:auto;font-family:var(--font-en)}
.reel-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#000;box-shadow:var(--shadow)}
.reel-video video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.reel-play{position:absolute;inset:0;margin:auto;width:78px;height:78px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:2rem;display:grid;place-items:center;backdrop-filter:blur(4px)}
.reel-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:rgba(0,0,0,.72);color:#fff;font-weight:700}
.reel-cap{padding:12px 16px;text-align:center;min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer}
.cap-en{font-size:1.3rem;font-weight:800;line-height:1.5}
.cap-en.pop{animation:pop .35s}
.cap-ar{color:var(--muted);font-weight:700}
.reels.no-ar .cap-ar{visibility:hidden}
#reelAr[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.reel-actions{display:flex;justify-content:center;gap:14px}
.reel-actions .liked{animation:bump .4s}
.reel-quiz{padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.reel-quiz .options{max-width:none}
.reel-credit{font-size:.72rem;color:var(--muted);text-align:center}
.credits p{margin-bottom:10px;font-size:.9rem;line-height:1.6}
.credits a{color:var(--primary)}

/* =========================================================
   12. TAB BAR, HUBS AND THE LEARN / ME FEATURES
   ========================================================= */
.tabbar{position:fixed;z-index:55;left:50%;bottom:0;transform:translateX(-50%);width:min(780px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--surface-solid);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);border-radius:20px 20px 0 0}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:14px;font-family:var(--emoji-font);font-size:1.35rem;min-height:54px;color:var(--muted);transition:background .2s}
.tabbar button span{font-family:var(--font-ar);font-size:.74rem;font-weight:800;line-height:1.3}
.tabbar button[aria-current=page]{background:var(--chip);color:var(--primary)}
body.has-tabs #app{padding-bottom:150px}
body.has-tabs #mascot{bottom:78px}
body.has-tabs[data-screen=reels] .reels,body.has-tabs[data-screen=reels] .reel{height:calc(100dvh - 152px);min-height:calc(100dvh - 152px)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.hub-card{display:flex;align-items:center;gap:12px;padding:14px;text-align:start;position:relative;transition:transform .15s;border:2px solid transparent}
.hub-card:hover{transform:translateY(-2px)}
.hub-card .emoji{font-size:2.2rem;width:52px;text-align:center;flex-shrink:0}
.hub-card .hub-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.hub-card small{color:var(--muted)}
.hub-card.rec{border-color:var(--primary)}
.hub-card .badge{position:absolute;top:8px;left:8px}
.sound-ico{font-family:var(--font-en)!important;font-weight:800;font-size:1.25rem!important;color:var(--primary)}
.mini-card.season{width:100%;margin-bottom:12px;border:2px solid var(--primary)}
.me-card{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:14px}
.me-buddy{width:96px;height:106px;flex-shrink:0}
.me-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.me-info b{font-size:1.2rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.abc-tile{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.abc-tile b{font-size:1.5rem}
.abc-tile .emoji{font-size:1.4rem}
.abc-tile.done{border-color:var(--good)}
.letter-card{padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.letter-big{font-size:5rem;font-weight:800;line-height:1;color:var(--primary)}
.letter-big small{font-size:3.4rem;color:var(--primary-2);margin-inline-start:14px}
.letter-word{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.letter-word .emoji{font-size:2.6rem}
.letter-word b{font-size:1.6rem}
.trace-box{padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.trace-box>.row{width:100%}
canvas.trace{background:var(--surface-solid);border-radius:var(--radius);border:2px dashed var(--line);touch-action:none;cursor:crosshair}
.tip-box{padding:12px 16px}
.tip-box summary{font-weight:800;cursor:pointer}
.tip-box p{margin-top:6px;line-height:1.8}
.pair-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pair-card{padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--border)}
.pair-card .emoji{font-size:3.4rem}
.pair-card b{font-size:1.5rem}
.pair-card small{color:var(--muted)}
.pair-card.correct{border-color:var(--good);background:var(--good-bg);animation:bounce .6s}
.pair-card.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .45s}
.pair-card.dim{opacity:.5}
.story-scene{padding:22px;text-align:center;margin-bottom:12px}
.story-scene .emoji{font-size:clamp(3.2rem,15vw,5rem);letter-spacing:6px;display:inline-block;animation:pop .45s}
.story-text{font-size:1.4rem;font-weight:700;line-height:1.9;text-align:center}
.story-text .w{cursor:pointer;border-radius:6px;padding:0 2px;transition:background .15s,color .15s}
.story-text .w.on{background:var(--primary);color:#fff}
.story-ar{text-align:center;color:var(--muted);font-weight:700;margin:6px 0 12px}
.story-next{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.story-next .opt small{display:block;color:var(--muted);font-family:var(--font-ar);font-weight:600}
.karaoke{padding:14px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.k-line{padding:8px 10px;border-radius:12px;transition:background .2s}
.k-line.on{background:var(--chip)}
.k-line p{font-size:1.3rem;font-weight:800}
.k-ar{color:var(--muted);font-weight:600}
.syl{transition:color .1s,transform .1s;display:inline-block}
.syl.on{color:var(--primary-2);transform:scale(1.25)}
.lesson-card{padding:16px}
.lesson-card h2{font-size:1.2rem;margin-bottom:8px;color:var(--primary)}
.lesson-card p{line-height:1.9}
.lesson-q{padding:14px;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.room{position:relative;width:100%;aspect-ratio:16/11;overflow:hidden;padding:0}
.room-wall{position:absolute;inset:0 0 40% 0;background:var(--wall)}
.room-floor{position:absolute;inset:60% 0 0 0;background:linear-gradient(180deg,var(--floor),color-mix(in srgb,var(--floor) 75%,#000))}
.room-slot{position:absolute;transform:translate(-50%,-50%);width:clamp(56px,16vw,86px);height:clamp(56px,16vw,86px);border-radius:18px;border:2px dashed rgba(0,0,0,.28);
  color:rgba(0,0,0,.45);font-size:1.6rem;display:grid;place-items:center;background:rgba(255,255,255,.35);z-index:2}
.room-slot.filled{border:none;background:none}
.room-slot .emoji{font-size:clamp(2.6rem,11vw,4rem);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.room-slot.wall.filled .emoji{font-size:clamp(2.2rem,9vw,3.4rem)}
.room-buddy{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:clamp(90px,26vw,140px);height:clamp(100px,29vw,154px);z-index:1}
.paint-row{display:flex;gap:10px;flex-wrap:wrap}
.paint{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:14px;border:2px solid transparent}
.paint i{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.paint.on{border-color:var(--primary)}
.paint small{font-size:.75rem;color:var(--muted)}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item-grid .btn{grid-column:1/-1}
.sheet{width:min(520px,100%)}
.cert-img{width:100%;border-radius:12px;box-shadow:var(--shadow)}
.cert-row.locked{opacity:.6}
.champ{margin-bottom:12px;border:2px solid #f5b301;width:100%}
.reel-words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.shortcuts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.shortcut .emoji{font-size:1.5rem}
.shortcut small{font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap}
.quick-games{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.quick-game{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;text-align:center}
.quick-game .emoji{font-size:2rem}
.quick-game small{font-weight:700;font-size:.75rem;line-height:1.3}
@media (max-width:420px){.shortcuts{grid-template-columns:repeat(3,1fr)}.quick-games{grid-template-columns:repeat(3,1fr)}}

@media (max-width:420px){
  .menu-row{grid-template-columns:1fr}
  .opt{min-height:104px}
  .tile{min-width:44px;height:54px;font-size:1.35rem;padding:0 10px}
  .slot{width:44px;height:54px}
  .feedback{padding-left:76px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/** Append worlds to an age group (keeps existing world indexes, so saved stars stay valid). */
function addWorlds(group, list) {
  const start = WORLDS[group].length;
  list.forEach((w, k) => {
    const wi = start + k;
    const words = w.words.map((line, i, arr) => {
      const [word, arabic, emoji, exampleSentence] = line.split('|');
      const obj = { word, arabic, emoji, exampleSentence, ageGroup: group, world: w.id, worldIndex: wi,
        level: Math.min(5, Math.floor(i * 5 / arr.length) + 1), key: group + ':' + word.toLowerCase() };
      VOCAB.push(obj); VOCAB_BY_KEY.set(obj.key, obj);
      return obj;
    });
    WORLDS[group].push({ ...w, index: wi, words, dialogues: w.dialogues || [] });
  });
}

/* ---------- progression ---------- */
const LEVELS_PER_WORLD = 6; // 5 levels + 1 boss
const worldsOf = () => WORLDS[P().age];
const isDone = (w, l, gp = G()) => (gp.stars[w + '-' + l] || 0) > 0;
function isUnlocked(w, l, gp = G()) {
  const ws = worldsOf();
  if (l === 0 && ws[w] && ws[w].free) return true;          // seasonal worlds (Ramadan & Eid) are always open
  if (l === 0 && w > 0) {                                     // otherwise a world opens after the previous regular world's boss
    let pw = w - 1; while (pw > 0 && ws[pw].free) pw--;
    if (ws[pw] && !ws[pw].free && pw !== w - 1) return w <= gp.placement || isDone(pw, LEVELS_PER_WORLD - 1, gp);
  }
  if (w < gp.placement) return true;
  if (w === gp.placement && l === 0) return true;
  if (w === 0 && l === 0) return true;
  if (l > 0) return isDone(w, l - 1, gp);
  return isDone(w - 1, LEVELS_PER_WORLD - 1, gp);
}
/** First unlocked-but-unfinished node: where the player should go next. */
function currentNode() {
  const ws = worldsOf();
  for (let w = 0; w < ws.length; w++)
    for (let l = 0; l < LEVELS_PER_WORLD; l++)
      if (isUnlocked(w, l) && !isDone(w, l)) return [w, l];
  return [ws.length - 1, LEVELS_PER_WORLD - 1];
}
function totalStars(p) {
  return sum(Object.values(p.groups).map(g => sum(Object.values(g.stars))));
}
function levelInfo(xp) {
  let lvl = 1, need = 100, rest = xp;
  while (rest >= need) { rest -= need; lvl++; need = 100 + (lvl - 1) * 50; }
  return { lvl, cur: rest, need };
}
function addXP(x) {
  const p = P();
  const before = levelInfo(p.xp).lvl;
  p.xp += x;
  if (p.week.key !== weekKey()) { p.lastWeek = { ...p.week }; p.week = { key: weekKey(), xp: 0 }; }   // keep last week for the family challenge
  p.week.xp += x;
  const after = levelInfo(p.xp).lvl;
  if (after > before) {
    setTimeout(() => { Sound.fanfare(); toast(`🎉 ترقية! وصلت إلى المستوى ${after}`); Confetti.burst(80); }, 400);
  }
}
const displayStreak = p => (p.lastDay === todayKey() || p.lastDay === dayKeyOffset(-1)) ? p.streak : 0;
function touchStreak() {
  const p = P(), t = todayKey();
  if (Native && Native.markPlayed) try { Native.markPlayed(t); } catch (e) {}   // the daily reminder skips days already played
  if (p.lastDay === t) return;
  p.streak = p.lastDay === dayKeyOffset(-1) ? p.streak + 1 : 1;
  p.bestStreak = Math.max(p.bestStreak, p.streak);
  p.lastDay = t;
  if (p.streak > 1) setTimeout(() => toast(`🔥 سلسلة ${p.streak} أيام متتالية!`), 600);
}

/* ---------- smart review (simple spaced repetition, Leitner boxes) ---------- */
const SRS_INTERVALS = [0, 5 * 60e3, 30 * 60e3, 6 * 3600e3, 24 * 3600e3, 3 * 24 * 3600e3, 7 * 24 * 3600e3];
function srsMark(word, ok) {
  const words = G().words;
  const r = words[word.key] || (words[word.key] = { c:0, w:0, box:0, due:0, seen:0 });
  r.seen = Date.now();
  if (ok) { r.c++; r.box = Math.min(SRS_INTERVALS.length - 1, r.box + 1); }
  else { r.w++; r.box = 0; }
  r.due = Date.now() + SRS_INTERVALS[r.box];
}
const isWeak = r => !!r && r.w > 0 && (r.box < 2 || r.w > r.c);
function learnedCount(p) {
  return sum(Object.values(p.groups).map(g => Object.values(g.words).filter(r => r.c > 0).length));
}
/** Words due for review, weakest first. */
function dueWords(limit = 12) {
  const gp = G(), now = Date.now();
  return Object.entries(gp.words)
    .filter(([, r]) => r.due <= now && (r.w > 0 || r.box < 3))
    .sort((a, b) => (isWeak(b[1]) - isWeak(a[1])) || (a[1].box - b[1].box))
    .map(([k]) => VOCAB_BY_KEY.get(k)).filter(Boolean).slice(0, limit);
}

   ========================================================= */
/** Android app bridge (see MainActivity.java). Absent in a normal browser. */
const Native = window.HakeemNative || null;

const Speech = {
  supported: !!Native || 'speechSynthesis' in window,
  en: null, en2: null, ar: null,
  seq: 0, cbs: {},
  init() {
    if (Native) {
      // Android TextToSpeech: voices are chosen natively; we only record what exists
      this.en = 'native';
      this.en2 = Native.hasAltVoice() ? 'alt' : null;
      this.ar = Native.hasLang('ar') ? 'native-ar' : null;
      return;
    }
    if (!this.supported) return;
    const load = () => {
      const vs = speechSynthesis.getVoices();
      const enUS = vs.filter(v => /^en[-_]US/i.test(v.lang));
      const enAll = enUS.length ? enUS : vs.filter(v => /^en/i.test(v.lang));
      const prefer = [/Google US English/i, /Samantha/i, /Aria/i, /Jenny/i, /Zira/i, /Natural/i];
      this.en = prefer.map(r => enAll.find(v => r.test(v.name))).find(Boolean) || enAll[0] || null;
      const male = [/David/i, /Guy/i, /Alex/i, /Daniel/i, /Fred/i, /Male/i];
      this.en2 = male.map(r => enAll.find(v => r.test(v.name) && v !== this.en)).find(Boolean)
              || enAll.find(v => v !== this.en) || null;
      this.ar = vs.find(v => /^ar/i.test(v.lang)) || null;
    };
    load();
    speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', load) : (speechSynthesis.onvoiceschanged = load);
  },
  rate(slow) {
    if (slow || settings().speed === 'slow') return 0.6;
    return P() && P().age === 'kids' ? 0.85 : 0.95;
  },
  /** Speak text. opts: {slow, lang, alt (second voice), pitch, queue, onend} */
  say(text, opts = {}) {
    let done = false;
    const end = () => { if (!done) { done = true; opts.onend && opts.onend(); } };
    if (!this.supported || !text) { setTimeout(end, 400); return; }
    const rate = opts.rate || this.rate(opts.slow);
    if (Native) {
      const id = String(++this.seq);
      this.cbs[id] = end;
      try { Native.speak(text, opts.lang || 'en-US', rate, opts.pitch || 1, !!opts.alt, !!opts.queue, id); }
      catch (e) { delete this.cbs[id]; setTimeout(end, 300); return; }
      setTimeout(() => { delete this.cbs[id]; end(); }, 1500 + text.length * 140 / rate);
      return;
    }
    try {
      if (!opts.queue) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = opts.lang || 'en-US';
      const v = u.lang.startsWith('ar') ? this.ar : (opts.alt && this.en2) || this.en;
      if (v) u.voice = v;
      u.rate = rate;
      u.pitch = opts.pitch || 1;
      u.onend = end; u.onerror = end;
      speechSynthesis.speak(u);
      // safety net: some engines never fire onend
      setTimeout(end, 1500 + text.length * 140 / u.rate);
    } catch (e) { setTimeout(end, 300); }
  },
  /** Arabic instruction (kids/young, if an Arabic voice exists), then the English audio. */
  hintThen(arText, thenFn) {
    const p = P();
    if (p && ['kids','young'].includes(p.age) && p.settings.arHints && this.ar && arText) {
      this.say(arText.replace(/[^؀-ۿ\s،؟]/g, ''), { lang:'ar-SA', rate:1, onend: () => setTimeout(thenFn, 150) });
    } else thenFn();
  },
  cancel() {
    try { Native ? Native.stop() : this.supported && speechSynthesis.cancel(); } catch (e) {}
  }
};
// callbacks from MainActivity
window.hakeemTtsDone = id => { const cb = Speech.cbs[id]; delete Speech.cbs[id]; cb && cb(); };

/** Speech recognition: browser Web Speech API, or Android's SpeechRecognizer via the bridge. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Recog = {
  h: null, cur: null,
  available() { try { return Native ? Native.srAvailable() : !!SR; } catch (e) { return false; } },
  /** handlers: { onresult(alternatives[]), onerror(code), onend() } */
  start(h) {
    this.stop();
    this.h = h;
    if (Native) { Native.srStart(); return; }
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5;
    rec.onresult = e => this.h === h && h.onresult([...e.results[0]].map(a => a.transcript));
    rec.onerror = e => this.h === h && h.onerror(e.error);
    rec.onend = () => { if (this.h === h) { this.h = null; this.cur = null; h.onend(); } };
    this.cur = rec;
    rec.start();
  },
  stop() {
    const was = this.h; this.h = null;
    if (Native) { if (was) try { Native.srStop(); } catch (e) {} return; }
    if (this.cur) { try { this.cur.abort(); } catch (e) {} this.cur = null; }
  },
  get active() { return !!this.h; }
};
window.hakeemSR = (type, data) => {
  const h = Recog.h; if (!h) return;
  if (type === 'result') h.onresult(data || []);
  else if (type === 'error') h.onerror(data);
  else if (type === 'end') { Recog.h = null; h.onend(); }
};

/** Short vibration feedback (Android app bridge or the Vibration API). */
function buzz(pattern) {
  if (!P() || settings().vibrate === false) return;
  try { Native ? Native.vibrate(Array.isArray(pattern) ? pattern[0] : pattern) : navigator.vibrate && navigator.vibrate(pattern); } catch (e) {}
}

const Sound = {
  ctx: null,
  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { return null; }
    return this.ctx;
  },
  /** One enveloped oscillator note. */
  tone(f, d, type = 'sine', vol = .15, delay = 0, slide = null) {
    if (!settings().sound) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
  },
  click()   { this.tone(620, .06, 'triangle', .08); },
  flip()    { this.tone(420, .08, 'triangle', .1, 0, 640); },
  correct(combo = 0) {
    const k = Math.pow(2, Math.min(combo, 10) / 12);   // each combo step = one semitone higher
    this.tone(660 * k, .12, 'sine', .16); this.tone(880 * k, .16, 'sine', .16, .1); this.tone(1320 * k, .25, 'triangle', .08, .2);
  },
  pop()     { this.tone(300, .08, 'sine', .18, 0, 900); this.tone(1200, .06, 'triangle', .06, .04); },
  chest()   { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .18, 'triangle', .12, i * .07)); },
  wrong()   { this.tone(220, .3, 'sawtooth', .07, 0, 110); this.tone(180, .3, 'square', .04, .05, 90); },
  coin()    { this.tone(988, .08, 'square', .05); this.tone(1319, .18, 'square', .05, .08); },
  star(i)   { this.tone(880 + i * 220, .2, 'triangle', .14); this.tone(1760 + i * 440, .15, 'sine', .05, .05); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'triangle', .14, i * .12));
    [523, 659, 784].forEach(f => this.tone(f * 2, .6, 'sine', .07, .5));

};

/** Soft generative background music (pentatonic over a I–vi–IV–V loop). */
const Music = {
  id: null, step: 0, out: null,
  chords: [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]],
  note(f, d, vol, type) {
    const c = Sound.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + d + .05);
  },
  start() {
    if (this.id) return;
    const c = Sound.ensure(); if (!c) return;
    this.out = c.createGain(); this.out.gain.value = 0.5; this.out.connect(c.destination);
    this.id = setInterval(() => {
      if (document.hidden) return;
      const ch = this.chords[Math.floor(this.step / 8) % 4];
      if (this.step % 8 === 0) this.note(ch[0] / 2, 3.2, .05, 'sine');
      if (Math.random() < .6) this.note(pick(ch) * (Math.random() < .5 ? 1 : 2), 1.1, .03, 'triangle');
      this.step++;
    }, 420);
  },
  stop() { clearInterval(this.id); this.id = null; if (this.out) { try { this.out.disconnect(); } catch (e) {} this.out = null; } },
  sync() { (P() && settings().music) ? this.start() : this.stop(); }
};

/* ---------- daily quests ---------- */
/** Small deterministic PRNG so everyone gets the same quests on the same day. */
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function questsToday() {
  const p = P(), day = todayKey();
  if (!p.quests || p.quests.day !== day) {
    const rnd = seeded(+day.replace(/-/g, '') + p.age.length * 7);
    const pool = QUESTS.filter(q => q.id !== 'speak' || Recog.available());
    const chosen = pool.map(q => ({ q, r: rnd() })).sort((a, b) => a.r - b.r).slice(0, 3).map(x => x.q);
    p.quests = { day, bonus: false, list: chosen.map(q => ({ id: q.id, target: q.target[p.age] || q.target.def, n: 0, claimed: false })) };
  }
  return p.quests;
}
/** Record progress. mode 'max' keeps the best value (e.g. combo). */
function questEvent(id, n = 1, mode = 'add') {
  const p = P(); if (!p) return;
  questsToday().list.forEach(q => {
    if (q.id !== id || q.n >= q.target) return;
    q.n = Math.min(q.target, mode === 'max' ? Math.max(q.n, n) : q.n + n);
    if (q.n >= q.target) {
      const def = QUESTS.find(x => x.id === id);
      setTimeout(() => { toast(`🎯 مهمة مكتملة: ${def.icon} ${def.name} — استلم جائزتك من الرئيسية`); Sound.coin(); }, 700);
    }
  });
}

function toast(html, ms = 2800) {

const Confetti = {
  parts: [], running: false, cv: null, cx: null,
  burst(n = 140) {
    if (reducedMotion()) n = Math.min(n, 25);
    const cv = this.cv || (this.cv = $('#confetti'));
    this.cx = this.cx || cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#f43f5e', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#facc15'];
    for (let i = 0; i < n; i++) this.parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .5, y: innerHeight * .35,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: pick(colors),
      r: Math.random() * 6, vr: (Math.random() - .5) * .3
    });
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); }
  },
  loop() {
    const { cx, cv } = this;
    cx.clearRect(0, 0, cv.width, cv.height);
    this.parts = this.parts.filter(p => p.y < cv.height + 30);
    for (const p of this.parts) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.loop());
    else { this.running = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }
};

function questsHTML() {
  const qs = questsToday();
  return `<div class="panel glass quests"><div class="row" style="justify-content:space-between"><b>🎯 مهام اليوم</b><small class="muted">تتجدّد كل يوم</small></div>
    ${qs.list.map((q, i) => {
      const def = QUESTS.find(x => x.id === q.id), done = q.n >= q.target;
      return `<div class="quest ${q.claimed ? 'claimed' : ''}"><span class="emoji">${def.icon}</span>
        <div class="qtxt"><b>${def.name}</b><div class="row" style="flex-wrap:nowrap"><div class="bar"><i style="width:${q.n / q.target * 100}%"></i></div><small class="en">${q.n}/${q.target}</small></div></div>
        ${q.claimed ? '<span class="badge">✅</span>' : done ? `<button class="btn btn-primary claim" data-claim="${i}">استلم 🎁</button>` : `<span class="badge">+${QUEST_REWARD.coins} 🪙</span>`}</div>`;
    }).join('')}</div>`;
}
function claimQuest(i) {
  const p = P(), qs = questsToday(), q = qs.list[i];
  if (!q || q.claimed || q.n < q.target) return;
  q.claimed = true;
  p.coins += QUEST_REWARD.coins; addXP(QUEST_REWARD.xp);
  Sound.chest(); buzz(30); Confetti.burst(70);
  toast(`🎁 +${QUEST_REWARD.coins} 🪙  و +${QUEST_REWARD.xp} XP`);
  if (!qs.bonus && qs.list.every(x => x.claimed)) {
    qs.bonus = true; p.coins += 50;
    setTimeout(() => { toast('🏆 أنهيت كل مهام اليوم! مكافأة إضافية +50 🪙', 3500); Sound.fanfare(); Confetti.burst(140); }, 900);
  }
  save(); checkAchievements(); rerender();
}

/* ---------- adventure map ---------- */
const NODE_GAP = 112;
const nodePos = (wi, l) => ({ x: 50 + 28 * Math.sin(l * 1.25 + wi * 1.7), y: 56 + l * NODE_GAP });
Screens.map = () => {
  const p = P(), ws = worldsOf(), gp = G();
  const [cw, cl] = currentNode();
  const H = 112 + 5 * NODE_GAP;
  render(topbar('خريطة المغامرة 🗺️', 'menu', `<span class="chip">⭐ ${sum(Object.values(gp.stars))}/${ws.length * 18}</span>`) +
    ws.map((w, wi) => {
      const pts = [...Array(LEVELS_PER_WORLD)].map((_, l) => nodePos(wi, l));
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], ym = (a.y + b.y) / 2; d += ` C ${a.x} ${ym}, ${b.x} ${ym}, ${b.x} ${b.y}`; }
      const wStars = sum(pts.map((_, l) => gp.stars[wi + '-' + l] || 0));
      const locked = !isUnlocked(wi, 0);
      return `<section class="world ${locked ? 'locked' : ''}" style="--w:${w.color}" aria-label="${w.ar}">
        <div class="world-head glass"><span class="emoji">${w.icon}</span><div><b>${w.ar}</b><span class="en">${w.name}</span></div>
          <span class="chip ws">${locked ? '🔒 مقفل' : '⭐ ' + wStars + '/18'}</span></div>
        <div class="path-wrap" style="height:${H}px">
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>
          ${pts.map((pt, l) => {
            const un = isUnlocked(wi, l), st = gp.stars[wi + '-' + l] || 0, boss = l === 5;
            const cur = wi === cw && l === cl && un && !isDone(wi, l);
            const label = (boss ? 'مستوى الزعيم' : 'المستوى ' + (l + 1)) + ' — ' + w.ar + (un ? `، ${st} نجوم` : ' (مقفل)');
            return `<div class="node ${boss ? 'boss' : ''} ${un ? '' : 'locked'} ${cur ? 'current' : ''}" style="left:${pt.x}%;top:${pt.y}px">
              ${cur ? `<span class="me" aria-hidden="true">${p.avatar}</span>` : ''}
              <button class="node-btn" data-node="${wi}-${l}" ${un ? '' : 'disabled'} aria-label="${label}">${un ? (boss ? '👑' : l + 1) : '🔒'}</button>
              <div class="nstars" aria-hidden="true">${[0, 1, 2].map(i => `<span class="${i < st ? '' : 'off'}">★</span>`).join('')}</div></div>`;
          }).join('')}
        </div></section>`;
    }).join(''));
  $$('[data-node]').forEach(b => b.onclick = () => { const [w, l] = b.dataset.node.split('-').map(Number); Sound.click(); startRun('level', { w, l }); });
  const cur = $('.node.current');
  if (cur) setTimeout(() => cur.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' }), 250);
  Mascot.say(AG().id === 'adults' ? 'اختر المستوى التالي للمتابعة.' : 'اختر مستوى وابدأ المغامرة! 🗺️', 'happy', 2500);
};

Screens.words = () => {
  const gp = G(); let tab = 'all', query = '';
  const entries = Object.entries(gp.words).map(([k, r]) => ({ w: VOCAB_BY_KEY.get(k), r })).filter(e => e.w && (e.r.c > 0 || e.r.w > 0));
  const weakN = entries.filter(e => isWeak(e.r)).length;
  render(topbar('📒 كلماتي', 'learn', `<span class="chip">${entries.length} كلمة</span>`) + `
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="all" aria-selected="true">الكل (${entries.length})</button>
      <button role="tab" data-tab="learned" aria-selected="false">أتقنتها (${entries.length - weakN})</button>
      <button role="tab" data-tab="weak" aria-selected="false">تحتاج مراجعة (${weakN})</button>
    </div>
    <input class="text-input" id="search" placeholder="ابحث بالإنجليزية أو العربية 🔎" style="margin-bottom:12px" aria-label="بحث">

    <div class="row center" style="margin-top:16px"><button class="btn btn-primary" data-go="review">🔁 ابدأ مراجعة ذكية</button></div>`);
  const draw = () => {
    let es = entries;
    if (tab === 'learned') es = es.filter(e => !isWeak(e.r));
    if (tab === 'weak') es = es.filter(e => isWeak(e.r));
    if (query) es = es.filter(e => e.w.word.toLowerCase().includes(query) || e.w.arabic.includes(query));
    es = [...es].sort((a, b) => b.r.seen - a.r.seen);
    $('#list').innerHTML = es.length ? es.map(e => `<div class="word-row"><span class="emoji">${e.w.emoji}</span>
      <div class="wtxt"><b class="en">${esc(e.w.word)}</b><small>${esc(e.w.arabic)}</small>
      ${AG().id !== 'kids' ? `<small class="en" style="display:block">${esc(e.w.exampleSentence)}</small>` : ''}</div>
      ${isWeak(e.r) ? '<span class="badge weak">للمراجعة</span>' : '<span class="badge">✓</span>'}
      <button class="icon-btn sm" data-say="${esc(e.w.word)}" aria-label="استمع إلى ${esc(e.w.word)}">🔊</button>
      ${AG().id !== 'kids' ? `<button class="icon-btn sm" data-say="${esc(e.w.exampleSentence)}" aria-label="استمع للجملة">💬</button>` : ''}</div>`).join('')
      : `<p class="center muted" style="padding:30px">${tab === 'weak' ? 'لا توجد كلمات ضعيفة 🎉' : 'لا توجد كلمات بعد. ابدأ اللعب لتملأ دفترك! 🎮'}</p>`;
  };
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; $$('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b)); draw(); });
  $('#search').oninput = e => { query = e.target.value.trim().toLowerCase(); draw(); };
  draw();
};

/* =========================================================
   8. GAME ENGINE — building a run of questions
   ========================================================= */
const canSpell = w => /^[a-z]{3,10}$/i.test(w.word);
const sentTokens = s => s.split(/\s+/).map(t => t.replace(/^[^\w']+|[^\w']+$/g, '')).filter(Boolean);
const canBuild = (w, group) => { const n = sentTokens(w.exampleSentence).length; return n >= 3 && n <= (group === 'young' ? 8 : 11); };
const canFill = w => wordRegex(w.word).test(w.exampleSentence);
const FITS = { listen: () => true, look: () => true, truefalse: () => true, speak: () => true, spell: canSpell, fill: canFill, build: canBuild };

/** Words available for smart review: due first, then weak, then recently seen. */
function reviewPool() {
  const gp = G();
  const out = dueWords(10);
  const extra = Object.entries(gp.words)
    .filter(([k, r]) => r.c > 0 || r.w > 0)
    .sort((a, b) => (isWeak(b[1]) - isWeak(a[1])) || (a[1].box - b[1].box))
    .map(([k]) => VOCAB_BY_KEY.get(k)).filter(w => w && !out.includes(w));
  while (out.length < 6 && extra.length) out.push(extra.shift());
  return out;
}

function startRun(kind, opt = {}) {
  const p = P(), g = AGE_GROUPS[p.age];
  const practice = kind === 'placement' || kind === 'review' || kind === 'practice';
  const run = {
    kind, group: p.age, w: opt.w || 0, l: opt.l || 0, mode: opt.mode, idx: 0,
    correct: 0, wrong: 0, skipped: 0, mistakes: [], combo: 0, bestCombo: 0, xp: 0, coins: 0,
    ratios: [], start: Date.now(), hearts: practice ? Infinity : g.hearts, maxHearts: g.hearts,
    seenModes: {}, placeLog: [], retry: []
  };
  run.questions = buildQuestions(run);
  if (!run.questions.length) { toast('لا توجد أسئلة متاحة الآن'); return show('menu'); }
  state.run = run;
  // Introduce brand-new words before a regular level
  if (kind === 'level' && run.l < 5) {
    const fresh = WORLDS[run.group][run.w].words.filter(w => w.level === run.l + 1 && !(G().words[w.key] && G().words[w.key].c));
    if (fresh.length) return show('intro', fresh);
  }
  show('play');
}

function buildQuestions(run) {
  if (run.kind === 'practice') return buildPractice(run);
  const g = AGE_GROUPS[run.group], ws = WORLDS[run.group];
  if (run.kind === 'level') {
    const w = ws[run.w], boss = run.l === 5;
    const pool = boss ? w.words.map(x => ({ x, wt: 1 }))
      : w.words.filter(x => x.level <= run.l + 1).map(x => ({ x, wt: x.level === run.l + 1 ? 3 : 1 }));
    const modes = g.modes.filter(m => MODE_UNLOCK[m] <= run.l);
    return composeRun(run, pool, modes, g.qCount + (boss ? 4 : 0), w.dialogues, boss ? 2 : 1);
  }
  if (run.kind === 'daily') {
    let words = ws.flatMap((w, wi) => w.words.filter(x => isUnlocked(wi, x.level - 1)));
    if (words.length < 6) words = ws[0].words.slice(0, 6);
    return composeRun(run, words.map(x => ({ x, wt: 1 })), g.modes.filter(m => m !== 'dialogue'), g.qCount);
  }
  if (run.kind === 'review') {
    const words = reviewPool();
    const modes = g.modes.filter(m => ['listen', 'look', 'truefalse', 'spell', 'fill', 'speak'].includes(m));
    return composeRun(run, words.map(x => ({ x, wt: 1 })), modes, Math.max(4, Math.min(10, words.length)));
  }
  // placement: 2 questions from each of the first five worlds, harder words
  const qs = [];
  for (let wi = 0; wi < Math.min(5, ws.length); wi++) {
    shuffle(ws[wi].words.filter(x => x.level >= 2)).slice(0, 2).forEach((w, k) => {
      const mode = run.group !== 'kids' && k === 1 && canFill(w) ? 'fill' : 'listen';
      const q = makeQ(mode, w, run); q.placeWorld = wi; qs.push(q);
    });
  }
  return qs;

/** Choose a varied sequence of modes, then pick words (weak & new words weighted up). */
function composeRun(run, pool, modes, n, dialogues = [], maxDlg = 1) {
  const g = AGE_GROUPS[run.group], gp = G();
  if (!pool.length) return [];
  pool.forEach(p => { if (isWeak(gp.words[p.x.key])) p.wt += 3; });
  const core = modes.filter(m => !['match', 'dialogue', 'pop'].includes(m));
  let bag = [];
  const nextMode = prev => {
    if (!bag.length) bag = shuffle(core);
    let m = bag.pop();
    if (m === prev && core.length > 1) { if (!bag.length) bag = shuffle(core); const alt = bag.pop(); bag.unshift(m); m = alt; }
    return m;
  };
  const seq = [];
  for (let i = 0; i < n; i++) seq.push(i === 0 && core.includes('listen') ? 'listen' : nextMode(seq[i - 1]));
  if (modes.includes('match') && pool.length >= 2) seq[Math.floor(n / 2)] = 'match';
  if (modes.includes('pop') && pool.length >= 3) seq[Math.floor(n * 0.75)] = 'pop';
  const dl = shuffle(dialogues);
  if (modes.includes('dialogue')) for (let k = 0; k < Math.min(maxDlg, dl.length); k++) seq[n - 2 - k * 3] = 'dialogue';

  const used = new Map(); let last = null, dIdx = 0;
  const takeWord = fit => {
    const cands = pool.filter(p => (p.x !== last || pool.length === 1) && fit(p.x, run.group));
    if (!cands.length) return null;
    const wts = cands.map(p => p.wt / (1 + 2 * (used.get(p.x) || 0)));
    let r = Math.random() * sum(wts);
    for (let i = 0; i < cands.length; i++) { r -= wts[i]; if (r <= 0) return cands[i].x; }
    return cands[cands.length - 1].x;
  };
  return seq.map(mode => {
    if (mode === 'dialogue') return { mode, dlg: dl[dIdx++], order: shuffle([0, 1, 2, 3]) };
    if (mode === 'match' || mode === 'pop') {
      const uniq = [];
      shuffle(pool.map(p => p.x)).forEach(x => { if (!uniq.some(u => u.emoji === x.emoji)) uniq.push(x); });
      return { mode, words: uniq.slice(0, mode === 'pop' ? 3 : g.pairs) };
    }
    let w = takeWord(FITS[mode]);
    if (!w) { mode = 'listen'; w = takeWord(FITS.listen) || pool[0].x; }
    used.set(w, (used.get(w) || 0) + 1); last = w;

}

function makeQ(mode, w, run) {
  const q = { mode, word: w };
  if (mode === 'listen' || mode === 'look') q.opts = shuffle([w, ...distractors(w, 3, run.group)]);
  if (mode === 'truefalse') { q.truth = Math.random() < .5; q.said = q.truth ? w : distractors(w, 1, run.group)[0]; }
  if (mode === 'fill') q.opts = shuffle([w, ...distractors(w, 3, run.group, true)]);
  if (mode === 'spell') {
    const letters = w.word.toLowerCase().split('');
    let s, tries = 0;
    do { s = shuffle(letters); } while (s.join('') === letters.join('') && tries++ < 10);
    q.letters = s.map((ch, i) => ({ id: i, ch }));
  }
  if (mode === 'build') {
    q.tokens = sentTokens(w.exampleSentence);
    let s, tries = 0;
    do { s = shuffle(q.tokens.map((t, i) => ({ id: i, t }))); } while (s.map(o => o.t).join(' ') === q.tokens.join(' ') && tries++ < 10);
    q.bank = s;
  }
  return q;
}

/** Wrong options: same world first (different emoji), then the rest of the age group. */
function distractors(w, k, group, sameShape = false) {
  const multi = x => /\s/.test(x.word);
  const c = shuffle(WORLDS[group][w.worldIndex].words.filter(x => x !== w && x.emoji !== w.emoji && x.word.toLowerCase() !== w.word.toLowerCase()));
  if (sameShape) c.sort((a, b) => (multi(a) !== multi(w)) - (multi(b) !== multi(w)));
  const out = [];
  for (const x of c) { if (out.length >= k) break; if (!out.some(o => o.emoji === x.emoji)) out.push(x); }
  if (out.length < k) {
    const extra = shuffle(WORLDS[group].flatMap(x => x.words).filter(x => x !== w && x.emoji !== w.emoji && !out.some(o => o.emoji === x.emoji || o.word === x.word)));
    out.push(...extra.slice(0, k - out.length));
  }
  return out;
}

function answer(ok, extra = {}) {

  run.answered = true; stopTimer(); stopRecognition();
  const q = run.questions[run.idx], p = P(), g = AGE_GROUPS[run.group];
  const secs = (Date.now() - run.qStart) / 1000;
  const retry = !!q.retry;   // correction-round questions don't affect stars or hearts
  if (extra.skip) run.skipped++;
  else if (ok) {
    if (!retry) run.correct++;
    run.combo++;
    run.bestCombo = Math.max(run.bestCombo, run.combo);
    p.stats.bestCombo = Math.max(p.stats.bestCombo, run.combo);
    const xp = retry ? Math.ceil(g.xp / 2) : g.xp * (g.combo ? comboMult(run.combo) : 1);
    addXP(xp); run.xp += xp; p.coins += g.coins; run.coins += g.coins;
    if (q.mode === 'speak') { p.stats.speak++; questEvent('speak'); }
    if (SPEED_LIMIT[q.mode] && !retry) run.ratios.push(secs / (SPEED_LIMIT[q.mode] * (run.group === 'kids' ? 2 : 1)));

    if (!retry) {

      if (Number.isFinite(run.hearts)) run.hearts--;

const MODES = {};
const optClasses = (btns, isRight, chosen) => btns.forEach((b, j) => {
  b.disabled = true;
  b.classList.add(isRight(j) ? 'correct' : j === chosen ? 'wrong' : 'dim');
});

/* 1) Listen & Pick */
MODES.listen = (q, st, run, prompt, first) => {

  st.innerHTML = `<p class="prompt">${prompt}</p>
    <div class="speak-row"><button class="speak-btn" id="play" aria-label="استمع للكلمة">🔊</button><button class="speak-btn slow" id="slow" aria-label="استمع ببطء">🐢</button></div>
    <div class="options">${q.opts.map((o, i) => `<button class="opt" data-i="${i}" aria-label="الخيار ${i + 1}${label ? ': ' + esc(o.arabic) : ''}">
      <span class="kbd">${i + 1}</span><span class="emoji">${o.emoji}</span>${label ? `<span class="lbl">${esc(o.arabic)}</span>` : ''}</button>`).join('')}</div>`;
  const play = slow => { Speech.say(q.word.word, { slow }); pulse('#play'); };
  $('#play').onclick = () => play(false);
  $('#slow').onclick = () => play(true);
  const btns = $$('.opt', st), right = j => q.opts[j] === q.word;

  setTimeout(() => Speech.hintThen(first ? prompt : null, () => { if (q.alive()) play(false); }), 300);
};

/* 9) True or False: does the word you hear match the picture? */
MODES.truefalse = (q, st, run, prompt, first) => {

  const yes = $('#tfYes'), no = $('#tfNo');
  const mark = chosen => {
    yes.disabled = no.disabled = true;
    (q.truth ? yes : no).classList.add('correct');
    if (chosen && chosen !== (q.truth ? yes : no)) chosen.classList.add('wrong');
  };
